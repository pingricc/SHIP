/* --- decode --- */
function wscParse(dv){try{const b=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);let i=0,o={};const rd=(b,s,e)=>{let j=s;while(j+4<=e){const t=(b[j]<<8)|b[j+1],l=(b[j+2]<<8)|b[j+3],v=b.slice(j+4,j+4+l);
    if(t===0x100E)rd(b,j+4,j+4+l);else if(t===0x1045)o.ssid=new TextDecoder().decode(v);else if(t===0x1003)o.auth=(v[0]<<8)|v[1];else if(t===0x1027)o.key=new TextDecoder().decode(v);j+=4+l}};
  rd(b,0,b.length);return o}catch(e){return {}}}
function decodeRec(r,depth=0){const o={type:r.recordType,media:r.mediaType||'',lang:r.lang||'',val:'',raw:''};
  try{
    if(r.recordType==='text'){o.val=new TextDecoder(r.encoding||'utf-8').decode(r.data)}
    else if(r.recordType==='url'||r.recordType==='absolute-url'){o.val=new TextDecoder().decode(r.data)}
    else if(r.recordType==='smart-poster'&&depth<2){const sub=(r.toRecords()||[]).map(x=>decodeRec(x,depth+1));o.val=sub.map(x=>x.val).filter(Boolean).join(' · ');o.sub=sub}
    else if(r.recordType==='mime'){if(/wfa\.wsc/.test(r.mediaType)){const w=wscParse(r.data);o.val='Wi-Fi: '+(w.ssid||'?')+(w.key?' · password set':'');o.wifi=w}
      else if(/^text\/|json|xml|vcard/.test(r.mediaType))o.val=new TextDecoder().decode(r.data);else o.val=`(${r.data.byteLength} bytes)`;o.raw=hex(r.data)}
    else if(r.recordType==='empty'){o.val='(empty record)'}
    else if(/:/.test(r.recordType)){const t=new TextDecoder().decode(r.data);o.val=r.recordType==='android.com:pkg'?'Launch app: '+t:t;o.raw=hex(r.data)}
    else{o.val=r.data?`(${r.data.byteLength} bytes)`:'';o.raw=hex(r.data)}
  }catch(e){o.val='(unreadable)'}
  return o}

/* --- context, rules, actions --- */
function mkCtx(sn,recs){const all=recs.map(r=>r.val).join(' | ');const text=(recs.find(r=>r.type==='text')||{}).val||'';const url=(recs.find(r=>/url/.test(r.type))||{}).val||'';
  let ship=recs.map(r=>parseShip(r.val)).find(Boolean)||null;const tag=NFC.tags[sn]||null;
  if(!ship&&tag&&tag.item)ship=parseShip('SHIP:'+tag.item);
  return{sn,recs,all,text,url,ship,tag,name:tag&&tag.name||'',t:nowS(),ts:Date.now()}}
function tpl(s,c){const d=new Date();return String(s||'').replace(/\{(\w+)\}/g,(m,k)=>({serial:c.sn,text:c.text,url:c.url,all:c.all,id:c.ship?c.ship.id:'',section:c.ship?SHIPT[c.ship.s][0]:'',name:c.name,date:d.toISOString().slice(0,10),time:d.toTimeString().slice(0,5),iso:d.toISOString(),device:'SHIP'})[k]??m)}
function timeOk(r){const w=r.when||{};const d=new Date();if(w.days&&w.days.length&&!w.days.includes(d.getDay()))return false;
  if(w.from&&w.to){const m=d.getHours()*60+d.getMinutes(),f=+w.from.slice(0,2)*60+ +w.from.slice(3),t=+w.to.slice(0,2)*60+ +w.to.slice(3);return f<=t?(m>=f&&m<=t):(m>=f||m<=t)}return true}
function condOk(r,c){const v=(r.cond.val||'').trim(),lv=v.toLowerCase();
  switch(r.cond.type){
   case 'any':return true;
   case 'ship':return !!c.ship&&(!r.cond.sec||c.ship.s===r.cond.sec)&&(!v||c.ship.id===v);
   case 'serial':return !!v&&c.sn.toLowerCase()===lv;
   case 'known':return !!c.tag;
   case 'unknown':return !c.tag;
   case 'text':return !!v&&c.all.toLowerCase().includes(lv);
   case 'url':return !!v&&c.url.toLowerCase().includes(lv);
   case 'regex':try{return new RegExp(v,'i').test(c.all)}catch(e){return false}
   case 'empty':return !c.recs.length||c.recs.every(x=>x.type==='empty');
  }return false}
const ATYPES={open:'Open the SHIP item',ticket:'Open a ticket for the item',checklist:'Open a checklist',round:'Log a round check-in',webhook:'Call a webhook',link:'Open a link (web, tel:, sms:, mailto:, geo:)',app:'Launch an Android app',copy:'Copy text',share:'Share text',speak:'Read text aloud',notify:'Show a message',audit:'Mark as seen in the audit'};
const CTYPES={any:'Any tag',ship:'SHIP tag (section / item)',known:'Registered tag',unknown:'Unregistered tag',serial:'Serial number is',text:'Content contains',url:'Link contains',regex:'Content matches (regex)',empty:'Empty tag'};
async function runAction(a,c,res){
  switch(a.type){
   case 'open':{const p=a.target?parseShip('SHIP:'+a.target):c.ship;if(!p){res.push('open: no SHIP item');return}res.nav=()=>goTo(SHIPT[p.s][1],p.id);res.push('open '+p.id);return}
   case 'ticket':{const id=a.target||(c.ship?c.ship.id:'')||c.name||c.sn;res.nav=()=>{stack=['plancia','sec/tk#new:'+id];render()};res.push('ticket '+id);return}
   case 'checklist':{res.nav=()=>goTo('ck','c-'+(a.target||'d'));res.push('checklist '+(a.target||'d'));return}
   case 'round':{const lbl=tpl(a.text||'{name}{id}',c)||c.sn;NFC.log.unshift({t:c.t,ts:c.ts,sn:c.sn,v:'Round: '+lbl,kind:'round',lbl});res.push('round '+lbl);return}
   case 'webhook':{try{const url=tpl(a.url,c);if(!/^https:\/\//i.test(url)){res.push('webhook: https only');res.err=1;return}
      let h={};try{h=a.headers?JSON.parse(tpl(a.headers,c)):{}}catch(e){res.push('webhook: headers not valid JSON');res.err=1;return}
      const m=(a.method||'POST').toUpperCase(),body=m==='GET'?undefined:tpl(a.body||'{"serial":"{serial}","text":"{text}","id":"{id}","time":"{iso}"}',c);
      if(a.mode==='no-cors'){await fetch(url,{method:m,body,mode:'no-cors',headers:{'Content-Type':'text/plain'}});res.push('webhook sent ('+m+')')}
      else{if(body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(url,{method:m,headers:h,body});res.push('webhook '+r.status);if(!r.ok)res.err=1}
     }catch(e){res.push('webhook failed: '+(e.message||e.name));res.err=1}return}
   case 'link':{const u=tpl(a.url,c);if(u){res.nav=()=>{location.href=u};res.push('link')}return}
   case 'app':{const p=a.pkg||NFC.set.pkg;if(!p){res.push('app: package missing');res.err=1;return}res.nav=()=>{location.href=`intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${p};end`};res.push('app '+p);return}
   case 'copy':{try{await navigator.clipboard.writeText(tpl(a.text||'{all}',c));res.push('copied')}catch(e){res.push('copy blocked');res.err=1}return}
   case 'share':{try{await navigator.share({text:tpl(a.text||'{all}',c)});res.push('shared')}catch(e){res.push('share cancelled')}return}
   case 'speak':{try{const u=new SpeechSynthesisUtterance(tpl(a.text||'{name}',c));u.lang=a.lang||'it-IT';speechSynthesis.speak(u);res.push('spoken')}catch(e){res.push('speech not available')}return}
   case 'notify':{toast(tpl(a.text||'Tag {serial}',c));res.push('message');return}
   case 'audit':{auditMark(c);res.push('audit');return}
  }}
async function runRules(c,onlyRule){const res=[];res.matched=[];
  for(const r of NFC.rules){if(onlyRule&&r.id!==onlyRule)continue;if(!onlyRule&&!r.on)continue;if(!condOk(r,c)||!timeOk(r))continue;
    if(r.confirm&&!confirm('Run rule “'+r.name+'”?'))continue;
    res.matched.push(r.name);for(const a of r.actions)await runAction(a,c,res);if(r.stop)break}
  return res}
function auditMark(c){const A=NFC.audit;if(!A||A.done)return false;const id=c.ship&&c.ship.s==='INV'?c.ship.id:null;
  if(id){if(!A.seen[id])A.seen[id]=c.t}else{A.extra=A.extra||[];if(!A.extra.includes(c.sn))A.extra.push(c.sn)}nsave('audit');return !!id}
async function handleTag(sn,rawRecs,simulated){
  const recs=rawRecs.map(r=>r.val!==undefined?r:decodeRec(r));const c=mkCtx(sn||'—',recs);NFC.last=c;
  if(c.tag){c.tag.last=c.t;c.tag.count=(c.tag.count||0)+1;nsave('tags')}
  if(NFC.audit&&!NFC.audit.done)auditMark(c);
  const res=await runRules(c);
  if(!res.matched.length&&NFC.set.auto&&c.ship){res.push('open '+c.ship.id);res.nav=()=>goTo(SHIPT[c.ship.s][1],c.ship.id)}
  NFC.log.unshift({t:c.t,ts:c.ts,sn:c.sn,v:(c.name?c.name+' · ':'')+(c.all||'(empty tag)'),rules:res.matched,res:res.filter(x=>typeof x==='string').join(' · '),err:res.err?1:0,sim:simulated?1:0});
  NFC.log=NFC.log.slice(0,300);nsave('log');
  vib(res.err?[200,80,200]:60);beep(!res.err);
  NFC.status=res.matched.length?'Rules: '+res.matched.join(', '):(c.ship?'SHIP tag: '+c.ship.id:'Tag read');
  if(res.nav){if(NFC.scanning&&!NFC.set.cont)nfcStop();res.nav();return}
  if(NFC.scanning&&!NFC.set.cont)nfcStop();reRender()}

/* --- scan / write --- */
async function nfcScan(){
  if(!NFC.ok){toast('NFC needs Chrome on Android');return}
  if(NFC.scanning){nfcStop();return}
  try{const rd=new NDEFReader();NFC.ctl=new AbortController();await rd.scan({signal:NFC.ctl.signal});NFC.scanning=true;NFC.status='Hold a tag near the back of the phone';wakeOn();
    rd.onreadingerror=()=>{NFC.status='Tag not readable: try again';beep(false);reRender()};
    rd.onreading=e=>{if(NFC.busy)return;handleTag(e.serialNumber||'—',[...e.message.records])};
    reRender()}
  catch(e){NFC.scanning=false;NFC.status=e.name==='NotAllowedError'?'NFC permission denied: allow it in the site settings':'Cannot start NFC: check that NFC is on in the phone settings';reRender()}}
function nfcStop(){try{NFC.ctl&&NFC.ctl.abort()}catch(e){}NFC.scanning=false;wakeOff();NFC.status='Scanning stopped';reRender()}
function wscBuild(ssid,key,auth){const T=(t,v)=>{const b=new Uint8Array(4+v.length);b[0]=t>>8;b[1]=t&255;b[2]=v.length>>8;b[3]=v.length&255;b.set(v,4);return b};
  const cat=(...a)=>{const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let i=0;a.forEach(x=>{o.set(x,i);i+=x.length});return o};
  const A={open:[0,1,0,1],wpa2:[0,0x20,0,8],wpa:[0,2,0,4],mixed:[0,0x22,0,0x0c]}[auth||'wpa2'];
  const cred=cat(T(0x1026,[1]),T(0x1045,enc(ssid)),T(0x1003,A.slice(0,2)),T(0x100F,A.slice(2)),T(0x1027,enc(auth==='open'?'':key||'')),T(0x1020,[255,255,255,255,255,255]));
  return cat(T(0x104A,[0x10]),T(0x100E,cred),T(0x1049,[0,0x37,0x2A,0,1,0x20])).buffer}
const RTYPES={ship:'SHIP item',text:'Text',url:'Web link',tel:'Phone call',sms:'SMS',mail:'Email',geo:'Map position',wifi:'Wi-Fi network',vcard:'Contact card',json:'JSON data',app:'Launch Android app',empty:'Empty'};
function recToNdef(r){switch(r.k){
  case 'ship':return r.id?{recordType:'text',data:`SHIP:${r.s}:${r.id}`}:null;
  case 'text':return r.v?{recordType:'text',data:r.v,lang:r.lang||'en'}:null;
  case 'url':return r.v?{recordType:'url',data:/^[a-z]+:/i.test(r.v)?r.v:'https://'+r.v}:null;

const WF={busy:false,res:lsg('ship:wifilast',null),srv:lsg('ship:wifisrv','https://speed.cloudflare.com'),area:'',pts:lsg('ship:wifipts',[]),plan:null,planName:lsg('ship:wifiplan',''),pin:null,msg:'',tab:'test'};
function connInfo(){const c=navigator.connection||{};return{type:c.type||'unknown',eff:c.effectiveType||'—',down:c.downlink!=null?c.downlink+' Mbps':'—',rtt:c.rtt!=null?c.rtt+' ms':'—',online:navigator.onLine}}
const srvBase=()=>WF.srv.replace(/\/+$/,'');
const isCF=()=>/speed\.cloudflare\.com/.test(WF.srv);
async function wfPing(n=8){const t=[];for(let i=0;i<n;i++){const s=performance.now();try{await fetch(isCF()?srvBase()+'/__down?bytes=1&r='+Math.random():srvBase()+'/?r='+Math.random(),{cache:'no-store',mode:isCF()?'cors':'no-cors'})}catch(e){return null}t.push(performance.now()-s)}
  t.shift();const avg=t.reduce((a,b)=>a+b,0)/t.length,jit=t.slice(1).reduce((a,b,i)=>a+Math.abs(b-t[i]),0)/Math.max(1,t.length-1);return{ping:Math.round(avg),jit:Math.round(jit)}}
async function wfDown(bytes=10e6){if(!isCF())return null;const s=performance.now();try{const r=await fetch(srvBase()+'/__down?bytes='+Math.round(bytes)+'&r='+Math.random(),{cache:'no-store'});const b=await r.arrayBuffer();const sec=(performance.now()-s)/1000;return +(b.byteLength*8/sec/1e6).toFixed(1)}catch(e){return null}}
async function wfUp(bytes=3e6){if(!isCF())return null;const d=new Uint8Array(Math.round(bytes));const s=performance.now();try{await fetch(srvBase()+'/__up?r='+Math.random(),{method:'POST',body:d,cache:'no-store'});const sec=(performance.now()-s)/1000;return +(bytes*8/sec/1e6).toFixed(1)}catch(e){return null}}
async function wfRun(quick){if(WF.busy)return;WF.busy=true;WF.msg='Measuring latency…';reRender();
  const p=await wfPing();if(!p){WF.busy=false;WF.msg='Server not reachable: check the connection or the test server';reRender();return null}
  WF.msg='Measuring download…';reRender();const dn=await wfDown(quick?5e6:20e6);
  let up=null;if(!quick){WF.msg='Measuring upload…';reRender();up=await wfUp()}
  const c=connInfo();const r={t:nowS(),ping:p.ping,jit:p.jit,down:dn,up,type:c.type,eff:c.eff};
  WF.busy=false;WF.msg='';if(!quick){WF.res=r;lss('ship:wifilast',r)}reRender();return r}
const qcol=r=>!r||r.down==null?(r&&r.ping<40?'g':r&&r.ping<120?'a':'r'):r.down>=50?'g':r.down>=10?'a':'r';

function tdb(){return new Promise((ok,ko)=>{const r=indexedDB.open('shiptools',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=ko})}

const SHIPF={name:'',ok:false,saved:'',last:''};let FH=null,wT=null;
const shipKeys=()=>Object.keys(localStorage).filter(k=>k.startsWith('ship:')||k.startsWith('edits2:'));
const dump=()=>{const o={app:'SHIP',saved:new Date().toISOString(),data:{}};shipKeys().forEach(k=>o.data[k]=localStorage.getItem(k));return JSON.stringify(o,null,1)};
const hhmm=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open('ship',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=ko})}
async function kv(k,v){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv',v===undefined?'readonly':'readwrite'),st=t.objectStore('kv');const q=v===undefined?st.get(k):st.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}
async function writeFile(){if(!FH||!SHIPF.ok)return;try{const w=await FH.createWritable();await w.write(dump());await w.close();SHIPF.saved=hhmm()}catch(e){SHIPF.ok=false}}
function changed(){SHIPF.last=hhmm();clearTimeout(wT);wT=setTimeout(writeFile,800)}
addEventListener('storage',e=>{if(e.key&&(e.key.startsWith('ship:')||e.key.startsWith('edits2:')))changed()});
async function linkFile(){
  try{
    if(FH&&!SHIPF.ok){if((await FH.requestPermission({mode:'readwrite'}))==='granted'){SHIPF.ok=true;await writeFile();toast('Data file reconnected');render()}return}
    if(!window.showSaveFilePicker){toast('This browser cannot link files: use Edge or Chrome, or download a backup');return}
    FH=await showSaveFilePicker({suggestedName:'SHIP data.json',types:[{description:'SHIP data',accept:{'application/json':['.json']}}]});
    SHIPF.name=FH.name;SHIPF.ok=true;await kv('fh',FH);await writeFile();toast('Linked: '+FH.name);render()
  }catch(e){if(e.name!=='AbortError')toast('Could not link the file')}}
async function openDataFile(){
  const load=async txt=>{try{const o=JSON.parse(txt);if(o.app!=='SHIP'||!o.data)throw 0;shipKeys().forEach(k=>localStorage.removeItem(k));Object.entries(o.data).forEach(([k,v])=>localStorage.setItem(k,v));toast('Data loaded');setTimeout(()=>location.reload(),600)}catch(e){toast('This is not a SHIP data file')}};
  if(window.showOpenFilePicker){try{const [h]=await showOpenFilePicker({types:[{description:'SHIP data',accept:{'application/json':['.json']}}]});await load(await (await h.getFile()).text());FH=h;await kv('fh',h)}catch(e){}return}
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>load(await i.files[0].text());i.click()}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download='SHIP backup '+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
function resetData(el){if(!el.dataset.sure){el.dataset.sure=1;el.querySelector('b').textContent='Tap again to confirm the reset';setTimeout(()=>{delete el.dataset.sure;render()},4000);return}
  shipKeys().forEach(k=>localStorage.removeItem(k));toast('Sample data restored');setTimeout(()=>location.reload(),600)}
(async()=>{try{const h=await kv('fh');if(h){FH=h;SHIPF.name=h.name;SHIPF.ok=(await h.queryPermission({mode:'readwrite'}))==='granted'}}catch(e){}})();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
