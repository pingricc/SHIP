<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SHIP</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#152D30">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;
  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;
  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;
  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;
  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;
  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;
  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;
  --f:-apple-system,"SF Pro Text","Segoe UI",system-ui,Roboto,Arial,sans-serif;
  --m:"SF Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}
#stage{position:fixed;inset:0}
.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}
.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}
.framed .pv{display:flex}
.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}
.framed .app{border-radius:calc(22px / var(--s))}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column}
/* ===== temi ===== */
.sky{background:
  radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 62%,#e8eefc 60%,transparent),
  radial-gradient(1.5px 1.5px at 83% 31%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 86%,#e8eefc 60%,transparent),
  radial-gradient(1px 1px at 71% 12%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 44% 44%,#f3f0e6 60%,transparent),
  radial-gradient(1px 1px at 93% 58%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 80%,#e8eefc 60%,transparent),
  radial-gradient(ellipse at 50% 125%,rgba(201,168,106,.22) 0%,transparent 55%),
  linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 60%,var(--night-3) 100%)}
.deck{color:var(--cream);background:
  radial-gradient(ellipse at 50% -10%,rgba(230,211,166,.16),transparent 55%),
  repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,rgba(255,255,255,.03) 2px 5px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px),
  linear-gradient(175deg,var(--wood-1) 0%,var(--wood-2) 45%,var(--wood-3) 100%)}
.stone{color:var(--ink);background:
  radial-gradient(1px 1px at 20% 30%,rgba(0,0,0,.14) 50%,transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.35) 50%,transparent),
  linear-gradient(180deg,var(--stone-1),var(--stone-2));background-size:7px 7px,11px 11px,auto}
.paperbg{color:var(--ink);background:linear-gradient(180deg,var(--cream),var(--cream-2))}
/* ===== header ===== */
.hd{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:22px 20px 10px;flex:none}
.ttl{justify-self:center;font:800 32px var(--f);letter-spacing:.16em;padding-bottom:4px;border-bottom:2px solid var(--brass);white-space:nowrap}
.ttl.s{font-size:24px}
.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.stone .hb,.paperbg .hb{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.15)}
.hb svg{width:22px;height:22px}
.cmpb{position:relative;justify-self:end;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 30%,#B7C6A9,var(--sage) 55%,var(--sage-d));box-shadow:0 0 0 2px rgba(220,228,212,.55),0 6px 16px rgba(0,0,0,.4)}
.cmpb svg{width:27px;height:27px}
.badge{position:absolute;top:-4px;right:-4px;font:700 10px var(--m);font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:1px 5px}
.hdr{justify-self:end}
/* ===== main ===== */
.mn{flex:1;overflow-y:auto;padding:8px 20px 130px;-webkit-overflow-scrolling:touch}
.mn.fix{overflow:hidden;position:relative;padding:0}
.fade{animation:fd .28s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ===== isola: nessuno stile ===== */
.island{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 9px;border-radius:999px;z-index:30;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.3)}
.stone .island,.paperbg .island{background:rgba(40,40,40,.28)}
.ib{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.ib svg{width:30px;height:30px}
.ib.on{background:rgba(255,255,255,.34)}
.ib em{position:absolute;top:0;right:-3px;font:700 10px var(--m);font-style:normal;background:#fff;color:var(--ink);border-radius:999px;padding:1px 5px}
/* ===== atlante ===== */
/* verticale: costellazione a righe, niente posizioni assolute -> niente sovrapposizioni */
.const{position:absolute;inset:0 16px 104px;display:flex;flex-direction:column;justify-content:space-evenly;container-type:size;padding:6px 0}
.const .hemi{top:50%}
.crow{position:relative;display:flex;justify-content:center;gap:max(24px,14cqw)}
.crow.two{justify-content:space-between;padding:0 4cqw}
.const .equator{position:relative;top:auto;flex:none}
.const .st{position:relative;transform:none;left:auto;top:auto}
/* orizzontale: colonne di schede con anteprima */
.segv{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);margin:0 0 14px}
.segv button{font:700 13.5px var(--f);letter-spacing:.04em;padding:8px 16px;border-radius:999px;opacity:.75}
.segv button.on{background:#fff;color:var(--night-1);opacity:1}
.mapb{flex:none;display:inline-flex;align-items:center;gap:8px;padding:0 16px;height:46px;border-radius:14px;font:800 13px var(--f);letter-spacing:.06em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.mapb svg{width:22px;height:22px}
.nfil .srch{height:46px}
.nmaps{display:grid;gap:6px}.land .nmaps{grid-template-columns:1fr 1fr;gap:16px;align-items:start}.nmaps .sechd:first-child{margin-top:4px}
.netw{display:grid;gap:14px}.land .netw{grid-template-columns:minmax(0,1fr) 330px;align-items:start}
.npanel{display:none}.land .npanel{display:block;position:sticky;top:0}
.map{border-radius:18px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);padding:6px}
.map svg{display:block;width:100%;height:auto}
.land .map svg{max-height:calc(var(--H)*1px - 330px)}
.map .n rect{fill:rgba(27,43,66,.92);stroke:rgba(255,255,255,.35);stroke-width:1}
.map .n{cursor:pointer}.map .n:hover rect{stroke:#fff}
.map .n.sel rect{stroke:var(--brass);stroke-width:2.5}
.map .n text{fill:#fff;font:700 13px var(--f)}.map .n text.s{font:500 11px var(--m);fill:rgba(255,255,255,.65)}
.map .ln{stroke:rgba(255,255,255,.38);stroke-width:1.6;fill:none}.map .ln.bad{stroke:var(--red);stroke-dasharray:6 5}.map .ln.bk{stroke-dasharray:3 4}
.map .pt{font:600 10px var(--m);fill:var(--brass-l)}
.map .vl rect{fill:rgba(143,163,130,.14)}.map .vl.iso rect{stroke-dasharray:5 4}
.map .cloud{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;opacity:.75;margin:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;border-top:2px solid rgba(255,255,255,.5)}.legend i.bad{border-top:2px dashed var(--red)}
.nfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.nfil .srch{flex:1 1 220px;margin:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}.nfil .srch input{color:#fff}.nfil .srch input::placeholder{color:rgba(255,255,255,.55)}
.nfil .chips{margin:0}
.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid rgba(255,255,255,.1)}
.nrow:first-child{border-top:0}.nrow b{font-size:15px}.nrow .ip{font:600 13px var(--m);opacity:.8;text-align:right}
.nrow .sub{grid-column:2/4;font-size:12.5px;opacity:.65}.nrow.sel b{color:var(--brass-l)}
.dhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.dhd h2{margin:0;font:800 20px var(--f);letter-spacing:.04em}
.dnote{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13.5px}
.dbtns{display:flex;gap:8px;margin-top:14px}.dbtns button{flex:1;padding:10px;border-radius:12px;font:800 13px var(--f);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.dbtns button.pr{background:#fff;color:var(--night-1)}
.acards{position:absolute;inset:4px 20px 100px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1fr;gap:14px}
.ac{grid-column:span 3;min-height:0;display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(143,163,130,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s}
.ac.dn{grid-column:span 4;background:linear-gradient(180deg,rgba(201,168,106,.16),rgba(255,255,255,.05));border-color:rgba(230,211,166,.35)}
.ac:active{transform:scale(.98)}
.ach{display:flex;align-items:center;gap:10px;font:800 15px var(--f);letter-spacing:.12em}
.ach svg{width:20px;height:20px;opacity:.9}.ach .go{margin-left:auto;opacity:.5}.ach .go svg{width:18px;height:18px}
.acn{font-size:14.5px;font-weight:700;line-height:1.3;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1)}
.acl{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
.acr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}
.acr:first-child{border-top:0}.acr>span:not(.sem){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acr i{flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--m);font-style:normal;opacity:.7}
.hemi{position:absolute;left:50%;top:52%;width:min(92cqw,96cqh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(143,163,130,.10) 0%,rgba(143,163,130,.03) 49.8%,rgba(201,168,106,.05) 50.2%,rgba(201,168,106,.14) 100%)}
.equator{position:absolute;left:0;right:0;top:54%;border-top:1px dashed rgba(255,255,255,.25)}
.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:210px}
.sem{width:15px;height:15px;border-radius:50%;flex:none}
.sem.r{background:var(--red);box-shadow:0 0 0 3px rgba(192,80,60,.3),0 0 18px 6px rgba(192,80,60,.55)}
.sem.a{background:var(--amber);box-shadow:0 0 0 3px rgba(201,142,46,.3),0 0 18px 6px rgba(201,142,46,.5)}
.sem.g{background:var(--sage);box-shadow:0 0 0 3px rgba(143,163,130,.3),0 0 18px 6px rgba(143,163,130,.55)}
.sem.sm{width:10px;height:10px;box-shadow:none}
.lb{display:inline-flex;align-items:center;gap:8px;font:800 17px var(--f);letter-spacing:.12em;padding:9px 16px;border-radius:999px;color:#fff;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.st:active .lb{transform:scale(.95)}
.st.dn .lb{background:rgba(230,211,166,.14);border-color:rgba(230,211,166,.45)}
.lb svg{width:20px;height:20px}
.tag{font-size:14.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);max-width:210px;line-height:1.25}
/* ===== componenti cielo ===== */
.hero{display:flex;align-items:center;gap:10px;margin:4px 2px 14px;font-size:14px;color:#D8E0EA}
.hero b{color:#fff}
.gc{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gc h4{margin:0;font:800 13px var(--f);letter-spacing:.14em;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.gc h4 small{margin-left:auto;font:600 12px var(--m);letter-spacing:0;opacity:.7}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);width:100%;text-align:left}
.li:first-of-type{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:700}.li .t span{font-size:12.5px;opacity:.7}
.chev{opacity:.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cols{columns:2 300px;column-gap:12px}.cols>*{break-inside:avoid}
.plg{display:grid;gap:0 18px}.land .plg{grid-template-columns:1fr 1fr;align-items:start}.land .plg .sechd:first-child{margin-top:0}
.tile{position:relative;text-align:left;padding:12px;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);min-height:92px;display:flex;flex-direction:column;gap:4px}
.tile b{font:800 14px var(--f);letter-spacing:.06em}.tile span{font-size:12px;opacity:.75}
.tile>svg{width:24px;height:24px;opacity:.85;margin-bottom:4px}
.tile .sem{position:absolute;right:12px;top:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chip{flex:none;font:700 12.5px var(--f);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
.chip.on{background:#fff;color:var(--night-1)}
.alert{border-left:4px solid var(--red)}
.alert.a{border-left-color:var(--amber)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}
.bar.w i{background:var(--amber)}.bar.c i{background:var(--red)}
.pill{font:700 11.5px var(--f);padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-r{background:var(--red-l);color:var(--red)}.p-a{background:var(--amber-l);color:#8A5E14}.p-g{background:var(--sage-l);color:var(--sage-d)}.p-n{background:rgba(255,255,255,.18);color:inherit}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;border-left:1px dashed rgba(255,255,255,.35)}
.tl .li{border:0}
.tl .dot{position:absolute;left:0;width:13px;height:13px;border-radius:50%;background:var(--night-2);border:2px solid var(--brass)}
.tl .dot.ok{background:var(--sage);border-color:var(--sage)}
.acc{display:none;font-size:13px;padding:0 0 10px 20px;opacity:.85}
.acc.open{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv span{opacity:.65}
.sechd{font:800 12px var(--f);letter-spacing:.16em;opacity:.7;margin:18px 2px 8px;text-transform:uppercase}
/* ===== plancia: stessa struttura dell'Atlante, colori legno ===== */
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bb{position:relative;min-height:140px;padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:4px;color:var(--cream);text-align:left;
  background:rgba(3,18,20,.34);border:1px solid rgba(230,211,166,.32);box-shadow:inset 0 1px 0 rgba(255,230,190,.08);transition:transform .12s}
.bb:active{transform:scale(.97)}
.bi svg{width:24px;height:24px;color:var(--brass-l)}
.bb b{font:800 14px var(--f);letter-spacing:.12em}
.bn{position:absolute;right:14px;top:10px;font:800 26px var(--f);color:var(--brass-l)}
.bt{display:flex;align-items:center;gap:9px;margin-top:8px}
.bc{font-size:13px;font-weight:600;line-height:1.3;opacity:.85;margin-top:2px}
.bs{font-size:12px;font-weight:700;align-self:flex-start;padding:2px 9px;border-radius:999px;margin-top:auto}
.bs.c{background:var(--red-l);color:var(--red)}.bs.w{background:var(--amber-l);color:#8A5E14}.bs.a{background:rgba(230,211,166,.2);color:var(--cream)}
.paper{margin-bottom:10px;border-radius:16px;padding:12px 14px;color:var(--cream);background:rgba(3,18,20,.34);border:1px solid rgba(230,211,166,.32)}
.paper h3{margin:0 0 2px;font:800 13px var(--f);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.paper h3 small{margin-left:auto;font:600 12px var(--m);letter-spacing:0;opacity:.7}
.deck .hero{color:var(--cream-2)}.deck .hero b{color:#fff}
.rr{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:10px 0;border-top:1px solid rgba(230,211,166,.14);width:100%;text-align:left;color:var(--cream)}
.paper>.rr:first-child,.paper h3+.rr,.paper h3+.chk,.paper h3+.tk{border-top:0}
.rh{display:flex;gap:8px;align-items:baseline}.rh b{font:700 15px var(--f)}
.rw{font:600 12px var(--f);opacity:.65}
.rt{font-size:12.5px;opacity:.7}
.rbar{height:5px;border-radius:3px;background:rgba(230,211,166,.16);grid-column:1;overflow:hidden}.rbar i{display:block;height:100%;border-radius:3px;background:var(--sage)}
.rc{grid-column:2;grid-row:1/4;align-self:center;font:700 14px var(--m);color:var(--brass-l)}
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(230,211,166,.14);width:100%;text-align:left;color:var(--cream)}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid rgba(230,211,166,.55);display:grid;place-items:center;color:#fff}
.chk.done .box{background:var(--sage-d);border-color:var(--sage)}
.chk.done .ct{text-decoration:line-through;opacity:.45}
.ct{font-weight:600}.ct small{display:block;font-size:12px;opacity:.7;font-weight:400}
.tk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid rgba(230,211,166,.14);color:var(--cream)}
.tk .tx{flex:1;min-width:0}.tk .l1 b{font-weight:700;font-size:15px}
.tk .l2{font-size:12.5px;opacity:.7;margin-top:1px}
.addb{position:relative;justify-self:end;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(230,211,166,.2);color:var(--cream);border:1px solid rgba(230,211,166,.45)}
.addb svg{width:24px;height:24px}
/* ===== rubrica / utente ===== */
.pc{background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.pc .li{border-top-color:rgba(0,0,0,.08)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f);background:var(--sage-d);color:#fff}

icket<\/h2>\n   <span class=\"fl\">Description<\/span><textarea class=\"in\" oninput=\"NT.t=this.value\" placeholder=\"What happened\">${NT.t}<\/textarea>\n   <div class=\"fgrid\"><div><span class=\"fl\">Opened by<\/span><select class=\"in\" onchange=\"NT.by=this.value;drawNT()\">${PEOPLE.map(p=>`<option${p[0]===NT.by?' selected':''}>${p[0]}<\/option>`).join('')}<\/select><\/div>\n   <div><span class=\"fl\">Department<\/span><input class=\"in\" value=\"${dep}\" disabled><\/div>\n   <div><span class=\"fl\">Assigned to<\/span><select class=\"in\" onchange=\"NT.to=this.value\">${ASSIGN.map(a=>`<option${a===NT.to?' selected':''}>${a}<\/option>`).join('')}<\/select><\/div>\n   <div><span class=\"fl\">Atlas item<\/span><select class=\"in\" onchange=\"NT.o=this.value;drawNT()\"><option value=\"\">\u2014 none \u2014<\/option>${INVH.concat(['SW-SPA','SW-P1','AP-BAR']).map(n=>`<option${n===NT.o?' selected':''}>${n}<\/option>`).join('')}<\/select><\/div><\/div>\n   <span class=\"fl\">Status<\/span>${seg('st',STS.slice(0,3))}\n   <span class=\"fl\">Priority<\/span><div class=\"seg\"><button class=\"${!NT.u?'on':''}\" onclick=\"NT.u=0;drawNT()\">Normal<\/button><button class=\"${NT.u?'on':''}\" onclick=\"NT.u=1;drawNT()\">Urgent<\/button><\/div>\n   ${NT.o?`<span class=\"fl\">What changed on the item<\/span>${seg('c',['None','Replaced','Moved','Retired','New'])}`:''}\n   ${prop?`<div class=\"prop\"><b>WILL UPDATE<\/b>Inventory: ${NT.o} \u2192 ${NT.c}<br>Log: entry added with today\u2019s date<\/div>`:''}\n   <div class=\"acts\"><button class=\"btn\" onclick=\"closeOv()\">Cancel<\/button><button class=\"btn pr\" onclick=\"saveNT()\">${prop?'Save and update':'Save'}<\/button><\/div>`)}\nfunction saveNT(){const id=Math.max(...TK.map(t=>t.id))+1,dep=(PEOPLE.find(p=>p[0]===NT.by)||[])[1]||'';\n  TK.unshift({id,t:NT.t||'Ticket without description',by:NT.by,st:NT.st,to:NT.to,dep,u:NT.u,obj:NT.o,d:'2026-09-25',log:[['now','Opened by '+NT.by]].concat(NT.o&&NT.c!=='None'?[['now',NT.o+': '+NT.c.toLowerCase()]]:[])});\n  closeOv();TV.f='Open';render();toast('Ticket #'+id+' saved')}\n\nfunction render(){const k=cur(),t=/^t\\d+$/.test(k)?TK.find(x=>'t'+x.id===k):null;frame(t?'#'+t.id:'TICKETS',t?tkView(t):listView())}\n/* ============ OVERLAY ============ */\nfunction ov(html){const o=$('ov');o.innerHTML=`<div class=\"dim\" onclick=\"closeOv()\"><\/div>`+html;o.className='ov show'}\nfunction closeOv(){$('ov').className='ov';$('ov').innerHTML=''}\nfunction toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);setTimeout(()=>t.remove(),1800)}\n\nfunction sheet(html,sky){ov(`<div class=\"sheet${sky?' sk':''}\"><div class=\"grab\"><\/div>${html}<\/div>`)}\n\n/* ===== SHIP: salvataggio dati sezione ===== */\ntry{const x=JSON.parse(localStorage.getItem('ship:tk')||'null');if(x&&x.d&&x.v===3){if(x.d['TK'])(Array.isArray(TK)?TK.splice(0,TK.length,...x.d['TK']):Object.assign(TK,x.d['TK']))}}catch(e){}\n/* ============ LAYOUT TABLET (2:3 verticale, 3:2 orizzontale) ============ */\nlet LAND=false,PV='auto';\ntry{PV=localStorage.getItem('pvtk')||(innerWidth>=1400&&matchMedia('(pointer:fine)').matches?'p':'auto')}catch(e){PV='auto'}\nfunction layout(){PV='auto';\n  const vw=innerWidth,vh=innerHeight,app=$('app'),fr=$('frame');let x=0,y=0,w=vw,h=vh;\n  /* dimensioni reali: niente ingrandimento. In anteprima: Surface Go 4 (1920x1280 al 150% = 853x1280 CSS px), rimpicciolito solo per starci nello schermo */\n  let W=vw,H=vh,s=1;\n  if(PV!=='auto'){W=PV==='p'?853:1280;H=PV==='p'?1280:853;const m=40;s=Math.min(1,(vw-2*m)/W,(vh-2*m)/H);w=W*s;h=H*s;x=(vw-w)/2;y=(vh-h)/2}\n  LAND=W>H;\n  app.style.cssText=`--W:${W};--H:${H};--s:${s};left:${x}px;top:${y}px`;\n  fr.style.cssText=PV==='auto'?'display:none':`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;\n  document.body.classList.toggle('framed',PV!=='auto');\n  $('pv').innerHTML=[['p','Portrait'],['l','Landscape'],['auto','Full screen']].map(o=>`<button class=\"${PV===o[0]?'on':''}\" onclick=\"setPV('${o[0]}')\">${o[1]}<\/button>`).join('');\n  render();\n}\nfunction setPV(m){PV=m;try{localStorage.setItem('pvtk',m)}catch(e){}layout()}\naddEventListener('resize',layout);\nlayout();\n\nfunction openHash(hh){const h=hh!=null?hh:decodeURIComponent(location.hash.slice(1));if(!h)return;const t=TK.find(x=>'#'+x.id===h||'t'+x.id===h||String(x.id)===h);if(t){stack=['list','t'+t.id];render()}else if(h.startsWith('new')){newTicket(h.slice(4)||undefined)}}\naddEventListener('hashchange',openHash);openHash();\n/* ===== indizio di scorrimento ===== */\n(function(){const mn=document.getElementById('mn'),h=document.getElementById('morehint');\n  function upd(){const more=mn.scrollHeight-mn.clientHeight-mn.scrollTop>24,up=mn.scrollTop>8;\n    mn.classList.toggle('more',more);mn.classList.toggle('up',up);h.classList.toggle('show',more&&mn.scrollTop<40)}\n  mn.addEventListener('scroll',upd,{passive:true});\n  new MutationObserver(()=>requestAnimationFrame(upd)).observe(mn,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});\n  new ResizeObserver(upd).observe(mn);addEventListener('resize',upd);setTimeout(upd,50);\n})();\n\n/* ===== Edit: un solo pulsante nelle schede finali (utente, fornitore, software, device, VLAN) ===== */\n(function(){\n  const LS='edits2:Tickets';\n  let E={};try{E=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}\n  const store=()=>{try{localStorage.setItem(LS,JSON.stringify(E))}catch(e){}};\n  const PEN='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13 7l4 4\"/><\/svg>';\n  const route=()=>{try{return typeof cur==='function'?cur():''}catch(e){return ''}};\n  const say=m=>{try{toast(m)}catch(e){}};\n  const scopes=()=>{const L=[];const sh=document.querySelector('#ov .sheet');if(sh&&sh.querySelector('.ed-own'))L.push(sh);const mn=document.getElementById('mn');if(mn.querySelector('.ed-own'))L.push(mn);return L};\n  function wrapText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const L=[];let n;\n    while(n=w.nextNode()){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(p.closest('svg'))continue;if(p.children.length)L.push(n)}\n    L.forEach(t=>{const s=document.createElement('span');t.replaceWith(s);s.appendChild(t)})}\n  const leaves=el=>[...el.querySelectorAll('*')].filter(x=>!x.children.length&&x.textContent.trim()&&!x.closest('svg,.av,.sem,.dbar,.bar2,.rbar,h4')&&!['BUTTON','INPUT'].includes(x.tagName));\n  function keyOf(sc,el,i){return route()+'|'+(sc.id||'sheet')+'|'+i+'|'+el.textContent.replace(/\\s+/g,' ').trim().slice(0,40)}\n  function btnHTML(){return `<button class=\"edpage\" type=\"button\">${PEN}Edit<\/button>`}\n  function place(sc){const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child, #hd .edslot'):null);\n    if(!slot)return;slot.classList.add('edslot');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function start(sc,slot){sc._orig=[...sc.querySelectorAll('.ed-own')].map(x=>x.innerHTML);sc.classList.add('editmode');\n    sc.querySelectorAll('.ed-own').forEach(o=>{[o,...o.querySelectorAll('[onclick]')].forEach(x=>{if(x.getAttribute('onclick')){x.dataset.oc=x.getAttribute('onclick');x.removeAttribute('onclick')}});wrapText(o);leaves(o).forEach(x=>x.setAttribute('contenteditable','true'))});\n    slot.innerHTML='<span class=\"edgrp\"><button class=\"edpage\" type=\"button\">Cancel<\/button><button class=\"edpage sv\" type=\"button\">Save<\/button><\/span>';\n    const [cn,sv]=slot.querySelectorAll('button');\n    cn.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach((o,i)=>o.innerHTML=sc._orig[i]);end(sc,slot)};\n    sv.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach(o=>{o.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));\n      [o,...o.querySelectorAll('[data-oc]')].forEach(x=>{if(x.dataset.oc){x.setAttribute('onclick',x.dataset.oc);delete x.dataset.oc}});E[o.dataset.ek]=o.innerHTML});store();end(sc,slot);say('Change saved')};\n    const f=sc.querySelector('.ed-own [contenteditable]');if(f)f.focus()}\n  function end(sc,slot){sc.classList.remove('editmode');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function decorate(){scopes().forEach(sc=>{if(sc.classList.contains('editmode'))return;let fresh=false;\n    sc.querySelectorAll('.ed-own').forEach((o,i)=>{if(o.dataset.ek)return;fresh=true;o.dataset.ek=keyOf(sc,o,i);if(E[o.dataset.ek]!=null)o.innerHTML=E[o.dataset.ek]});\n    const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child'):null);\n    if(slot&&!slot.querySelector('.edpage'))place(sc)})}\n  const obs=new MutationObserver(()=>{obs.disconnect();try{decorate()}finally{watch()}});\n  const watch=()=>['mn','ov','hd'].forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el,{childList:true,subtree:true})});\n  watch();setTimeout(()=>{obs.disconnect();decorate();watch()},60);\n})();\n\n\naddEventListener('message',e=>{const d=e.data||{};if('hash' in d){try{closeOv()}catch(x){}if(d.hash)openHash(d.hash);else{stack=[stack[0]];render()}}});\n\n(function(){const o=document.getElementById('ov');if(!o)return;let last=null;new MutationObserver(()=>{const v=o.classList.contains('show');if(v!==last){last=v;parent.postMessage({ov:v},'*')}}).observe(o,{attributes:true,attributeFilter:['class']})})();\n\nconst _rF=render;render=function(){_rF();try{parent.postMessage({feed:'tk',items:TK.map(t=>({id:t.id,st:t.st,t:t.t,u:t.u,dep:t.dep,to:t.to}))},'*')}catch(e){}};try{parent.postMessage({feed:'tk',items:TK.map(t=>({id:t.id,st:t.st,t:t.t,u:t.u,dep:t.dep,to:t.to}))},'*')}catch(e){}\n\n(function(){const f=()=>document.documentElement.classList.toggle('phone',innerWidth<600);f();addEventListener('resize',f)})();\n\nconst _rS=render;render=function(){_rS();try{localStorage.setItem('ship:tk',JSON.stringify({v:3,t:Date.now(),d:{'TK':TK}}))}catch(e){}};\n<\/script>\n<\/body><\/html>\n"</script>
<script type="application/json" id="sec-ot">"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Open tasks<\/title>\n<style>\n:root{\n  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;\n  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;\n  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;\n  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;\n  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;\n  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;\n  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;\n  --f:-apple-system,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,Arial,sans-serif;\n  --m:\"SF Mono\",\"Cascadia Mono\",Consolas,ui-monospace,monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}\n#stage{position:fixed;inset:0}\n.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}\n.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}\n.framed .pv{display:flex}\n.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}\n.framed .app{border-radius:calc(22px / var(--s))}\n.wrap{position:absolute;inset:0;display:flex;flex-direction:column}\n/* ===== temi ===== */\n.sky{background:\n  radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 62%,#e8eefc 60%,transparent),\n  radial-gradient(1.5px 1.5px at 83% 31%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 86%,#e8eefc 60%,transparent),\n  radial-gradient(1px 1px at 71% 12%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 44% 44%,#f3f0e6 60%,transparent),\n  radial-gradient(1px 1px at 93% 58%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 80%,#e8eefc 60%,transparent),\n  radial-gradient(ellipse at 50% 125%,rgba(201,168,106,.22) 0%,transparent 55%),\n  linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 60%,var(--night-3) 100%)}\n.deck{color:var(--cream);background:\n  radial-gradient(ellipse at 50% -10%,rgba(230,211,166,.16),transparent 55%),\n  repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,rgba(255,255,255,.03) 2px 5px),\n  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px),\n  linear-gradient(175deg,var(--wood-1) 0%,var(--wood-2) 45%,var(--wood-3) 100%)}\n.stone{color:var(--ink);background:\n  radial-gradient(1px 1px at 20% 30%,rgba(0,0,0,.14) 50%,transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.35) 50%,transparent),\n  linear-gradient(180deg,var(--stone-1),var(--stone-2));background-size:7px 7px,11px 11px,auto}\n.paperbg{color:var(--ink);background:linear-gradient(180deg,var(--cream),var(--cream-2))}\n/* ===== header ===== */\n.hd{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:22px 20px 10px;flex:none}\n.ttl{justify-self:center;font:800 32px var(--f);letter-spacing:.16em;padding-bottom:4px;border-bottom:2px solid var(--brass);white-space:nowrap}\n.ttl.s{font-size:24px}\n.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.stone .hb,.paperbg .hb{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.15)}\n.hb svg{width:22px;height:22px}\n.cmpb{position:relative;justify-self:end;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;\n  background:radial-gradient(circle at 35% 30%,#B7C6A9,var(--sage) 55%,var(--sage-d));box-shadow:0 0 0 2px rgba(220,228,212,.55),0 6px 16px rgba(0,0,0,.4)}\n.cmpb svg{width:27px;height:27px}\n.badge{position:absolute;top:-4px;right:-4px;font:700 10px var(--m);font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:1px 5px}\n.hdr{justify-self:end}\n/* ===== main ===== */\n.mn{flex:1;overflow-y:auto;padding:8px 20px 130px;-webkit-overflow-scrolling:touch}\n.mn.fix{overflow:hidden;position:relative;padding:0}\n.fade{animation:fd .28s ease}\n@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n/* ===== isola: nessuno stile ===== */\n.island{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 9px;border-radius:999px;z-index:30;\n  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.3)}\n.stone .island,.paperbg .island{background:rgba(40,40,40,.28)}\n.ib{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}\n.ib svg{width:24px;height:24px}\n.ib.on{background:rgba(255,255,255,.34)}\n.ib em{position:absolute;top:0;right:-3px;font:700 10px var(--m);font-style:normal;background:#fff;color:var(--ink);border-radius:999px;padding:1px 5px}\n/* ===== atlante ===== */\n/* verticale: costellazione a righe, niente posizioni assolute -> niente sovrapposizioni */\n.const{position:absolute;inset:0 16px 104px;display:flex;flex-direction:column;justify-content:space-evenly;container-type:size;padding:6px 0}\n.const .hemi{top:50%}\n.crow{position:relative;display:flex;justify-content:center;gap:max(24px,14cqw)}\n.crow.two{justify-content:space-between;padding:0 4cqw}\n.const .equato appa Wellness':'kappa'};\nconst EMPN=['Anna Bianchi','Giulia Serra','Marco Deiana','Chiara Pinna','Luca Verdi','Rita Melis','Paola Loi','Sara Neri','Davide Mura','Elisa Porcu','Nadia Cossu','Paolo Gialli','Elena Blu','Marco Rosa'];\nconst INVH=['PC-FO-01','PC-FO-02','PC-FO-03','PC-AM-01','PC-AM-02','PC-HK-01','PC-SPA-01','PC-FB-01','PC-MN-01','PRN-FO-01','PRN-HK-01','PRN-AM-01','PRN-FB-01','TEL-HALL-01','TEL-BAR-01','TEL-DECT-05','TAB-FB-01','TAB-FB-02','TAB-SPA-01','HV-01','HV-02','SRV-POS','SRV-IPTV','NAS-01','VM-VCENTER','VM-PMS01','VM-LOCK','VM-PBX','VM-BKP','CLD-MAIL','CLD-ACC','CLD-SPA','CLD-AV','CLD-EPM','CLD-WGW','CLD-MDM'];\nfunction openSec(file,h){parent.postMessage({open:file,hash:h||''},'*')}\nconst L_SW=n=>SWID[n]?`openSec('Software','${SWID[n]}')`:`toast('${n}: not in Software yet')`;\nconst L_DEP=n=>DEPID[n]?`openSec('Departments','${DEPID[n]}')`:`openSec('Departments','')`;\nconst L_SUP=n=>SUPID[n]?`openSec('Suppliers','${SUPID[n]}')`:`toast('${n}: not in Suppliers yet')`;\nconst L_INV=h=>INVH.includes(h)?`openSec('Inventory','${h}')`:`toast('${h}: not in Inventory yet')`;\nconst L_EMP=n=>EMPN.includes(n)?`openSec('Departments','${n}')`:`toast('${n}: not a registered employee')`;\nconst lnk=(txt,js)=>`<span class=\"xlink\" onclick=\"event.stopPropagation();${js}\">${txt}<\/span>`;\n\nconst later=w=>`toast('${w} (after merge)')`;\nconst OWN=['__ticket__'];const card=(icon,title,inner,cnt,cls)=>`<div class=\"gc${cls?' '+cls:''}${((title==='Task'||title==='Description')&&stack.length>1)?' ed-own':''}\"><h4>${ic(icon)}${title}${cnt!=null?`<small>${cnt}<\/small>`:''}<\/h4><div style=\"margin-top:8px\">${inner}<\/div><\/div>`;\nconst ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);\nconst empty=t=>`<div class=\"empty\" style=\"padding:8px 0\">${t}<\/div>`;\nfunction isl(){return [ic('wheel',1.7),ic('phone'),ic('glob',1.7),ic('srch',2),ic('user')].map((x,i)=>`<button class=\"ib${i===0?' on':''}\" onclick=\"${later('Island')}\">${x}<\/button>`).join('')}\nfunction frame(title,html,keepScroll){\n  $('app').className='app deck'+(LAND?' land':'');\n  $('hd').innerHTML=`<button class=\"hb\" onclick=\"${stack.length>1?'back()':\"parent.postMessage({plancia:1},'*')\"}\">${ic('back',2.2)}<\/button>${T(title)}<span><\/span>`;\n  const mn=$('mn');mn.className='mn fade';mn.innerHTML=html;mn.scrollTop=0;$('isl').innerHTML=isl();}\n\n/* ============ DATI FINTI: OPEN TASKS ============ */\nconst TASKS=[\n {id:1,t:'Renew antivirus license',p:'high',due:'2026-10-05',src:'Contract expiry',st:0,\n  d:'The antivirus license for 60 workstations expires on 5 October. Check with corporate whether renewal is centralised; if not, get a quote from the supplier and have the spend approved before expiry.',\n  links:[['sup','Mu Security','Supplier'],['sw','Antivirus','Software'],['sec','vul','Security \u00b7 Vulnerability']],steps:['Ask corporate whether renewal is centralised','Request a quote','Spend approval','Check activation on all PCs'],log:[['22/09','Created from contract expiry']]},\n {id:2,t:'Update switch firmware',p:'high',due:'2026-10-10',src:'Security \u00b7 Patches',st:0,\n  d:'The core switch and two floor switches run firmware with a known vulnerability. Update while the hotel is closed, one at a time, checking uplinks after each reboot.',\n  links:[['net','SW-CORE','Network'],['net','SW-P2','Network'],['sec','patch','Security \u00b7 Patches']],steps:['Back up configuration','Update SW-P2','Update SW-CORE','Check uplinks and VLANs'],log:[['20/09','Created from Security']]},\n {id:3,t:'Label server room cables',p:'medium',due:'2026-10-20',src:'Half-yearly routine',st:0,\n  d:'Label patch panels and core switch cables following the agreed naming. Update the L2 map with the real ports.',\n  links:[['net','SW-CORE','Network'],['tk',18,'Linked ticket']],steps:['Print labels','Label patch panels','Update L2 map'],log:[['18/09','Created']]},\n {id:4,t:'Order toner',p:'medium',due:'2026-09-30',src:'Ticket',st:0,\n  d:'Toner almost g('en-GB',{day:'2-digit',month:'short'});\nconst dleft=d=>Math.round((new Date(d)-new Date(2026,8,25))/864e5);\nconst tFile=(f,h)=>location.href=encodeURI(f+' - plancia.html')+(h?'#'+h:'');\nfunction linkJS(l){const [k,v]=l;return k==='sup'?L_SUP(v):k==='sw'?L_SW(v):k==='inv'?L_INV(v):k==='dep'?(DEPID[v]?L_DEP(v):L_EMP(v)):k==='net'?`openSec('Network','${v}')`:k==='sec'?`openSec('Security','${v}')`:k==='tk'?`openPlancia('Tickets','t${v}')`:''}\nfunction openPlancia(f,h){parent.postMessage({open:f,hash:h||''},'*')}\n\nfunction listView(){const open=TASKS.filter(t=>!t.st),alta=open.filter(t=>t.p==='high').length;\n  const row=t=>`<div class=\"chk tkrow${t.st?' done':''}\" onclick=\"go('k${t.id}')\"><span class=\"box\" onclick=\"event.stopPropagation();tog(${t.id})\">${t.st?ic('check',3):''}<\/span>\n    <span class=\"ct\" style=\"flex:1\">${t.t}<small>${t.src} \u00b7 by ${fmtD(t.due)}${!t.st&&dleft(t.due)<=7?' \u00b7 <b class=\"soon\">in '+dleft(t.due)+' d<\/b>':''}<\/small><\/span><span class=\"pill ${PR[t.p]}\">${t.p}<\/span><span class=\"chev\">${ic('chev')}<\/span><\/div>`;\n  const ord=a=>a.slice().sort((x,y)=>['high','medium','low'].indexOf(x.p)-['high','medium','low'].indexOf(y.p)||x.due.localeCompare(y.due));\n  return hero(alta?'r':'a',alta+' high priority \u00b7 '+open.length+' to do')+\n  `<div class=\"xbar\" style=\"justify-content:flex-end\"><button class=\"xbtn pr\" onclick=\"toast('Nuovo task: prossimo passo')\">${ic('plus',2.4)}New task<\/button><\/div>\n   <div class=\"paper\"><h3>To do<small>${open.length}<\/small><\/h3>${ord(open).map(row).join('')}<\/div>\n   ${TASKS.some(t=>t.st)?`<div class=\"paper\"><h3>Completed<small>${TASKS.filter(t=>t.st).length}<\/small><\/h3>${TASKS.filter(t=>t.st).map(row).join('')}<\/div>`:''}`}\nfunction tog(id){const t=TASKS.find(x=>x.id===id);t.st=t.st?0:1;render();toast(t.st?'Completed':'Reopened')}\n\nfunction taskView(t){const n=dleft(t.due);\n  return (!t.st&&n<=7?hero(t.p==='high'?'r':'a','expires in '+n+' days ('+fmtD(t.due)+')'):t.st?hero('g','completed'):'')+\n  `<div class=\"swcols\">`+\n  card('ot','Task',`<div class=\"kv\"><span>Title<\/span><b>${t.t}<\/b><span>Priority<\/span><b>${t.p}<\/b><span>Due date<\/span><b>${fmtD(t.due)}<\/b><span>Source<\/span><b>${t.src}<\/b><span>Status<\/span><b>${t.st?'Completed':'To do'}<\/b><\/div>`)+\n  card('doc','Description',`<div class=\"desc\">${t.d}<\/div>`)+\n  card('link','Links',t.links.map(l=>`<div class=\"li\" style=\"cursor:pointer\" onclick=\"${linkJS(l)}\"><span class=\"t\"><b>${l[0]==='tk'?'Ticket #'+l[1]:l[1]||'Network map'}<\/b><span>${l[2]}<\/span><\/span><span class=\"chev\">${ic('chev')}<\/span><\/div>`).join(''),t.links.length)+\n  card('ck','Steps',t.steps.map((s,i)=>`<button class=\"chk${DONE[t.id+'_'+i]||t.st?' done':''}\" onclick=\"DONE['${t.id}_${i}']=!DONE['${t.id}_${i}'];render()\"><span class=\"box\">${DONE[t.id+'_'+i]||t.st?ic('check',3):''}<\/span><span class=\"ct\">${s}<\/span><\/button>`).join(''),t.steps.filter((_,i)=>DONE[t.id+'_'+i]||t.st).length+'/'+t.steps.length)+\n  card('tk','Updates',t.log.map(l=>`<div class=\"li\"><span class=\"t\"><b>${l[1]}<\/b><span>${l[0]}<\/span><\/span><\/div>`).join('')+`<div class=\"nnote\"><input class=\"in\" id=\"nn\" placeholder=\"Add an update\"><button class=\"xbtn\" onclick=\"addNote(${t.id})\">Add<\/button><\/div>`)+\n  `<\/div><div class=\"dbtns\" style=\"max-width:520px\"><button class=\"pr\" onclick=\"tog(${t.id})\">${t.st?'Reopen task':'Mark as completed'}<\/button><\/div>`}\nfunction addNote(id){const v=$('nn').value.trim();if(!v)return;TASKS.find(x=>x.id===id).log.push([new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}),v]);render()}\n\nfunction render(){const k=cur(),t=/^k\\d+$/.test(k)?TASKS.find(x=>'k'+x.id===k):null;frame(t?t.t.toUpperCase():'OPEN TASKS',t?taskView(t):listView())}\n/* ============ OVERLAY ============ */\nfunction ov(html){const o=$('ov');o.innerHTML=`<div class=\"dim\" onclick=\"closeOv()\"><\/div>`+html;o.className='ov show'}\nfunction closeOv(){$('ov').className='ov';$('ov').innerHTML=''}\nfunction toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);setTimeout(()=>t.remove(),1800)}\n\nfunction sheet(html,sky){ov(`<div class=\"sheet${sky?' sk':''}\"><div class=\"grab\"><\/div>${html}<\/div>`)}\n\n/* ===== SHIP: salvataggio dati sezione ===== */\ntry{const x=JSON.parse(localStorage.getItem('ship:ot')||'null');if(x&&x.d&&x.v===3){if(x.d['TASKS'])(Array.isArray(TASKS)?TASKS.splice(0,TASKS.length,...x.d['TASKS']):Object.assign(TASKS,x.d['TASKS']));if(x.d['DONE'])(Array.isArray(DONE)?DONE.splice(0,DONE.length,...x.d['DONE']):Object.assign(DONE,x.d['DONE']))}}catch(e){}\n/* ============ LAYOUT TABLET (2:3 verticale, 3:2 orizzontale) ============ */\nlet LAND=false,PV='auto';\ntry{PV=localStorage.getItem('pvtask')||(innerWidth>=1400&&matchMedia('(pointer:fine)').matches?'p':'auto')}catch(e){PV='auto'}\nfunction layout(){PV='auto';\n  const vw=innerWidth,vh=innerHeight,app=$('app'),fr=$('frame');let x=0,y=0,w=vw,h=vh;\n  /* dimensioni reali: niente ingrandimento. In anteprima: Surface Go 4 (1920x1280 al 150% = 853x1280 CSS px), rimpicciolito solo per starci nello schermo */\n  let W=vw,H=vh,s=1;\n  if(PV!=='auto'){W=PV==='p'?853:1280;H=PV==='p'?1280:853;const m=40;s=Math.min(1,(vw-2*m)/W,(vh-2*m)/H);w=W*s;h=H*s;x=(vw-w)/2;y=(vh-h)/2}\n  LAND=W>H;\n  app.style.cssText=`--W:${W};--H:${H};--s:${s};left:${x}px;top:${y}px`;\n  fr.style.cssText=PV==='auto'?'display:none':`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;\n  document.body.classList.toggle('framed',PV!=='auto');\n  $('pv').innerHTML=[['p','Portrait'],['l','Landscape'],['auto','Full screen']].map(o=>`<button class=\"${PV===o[0]?'on':''}\" onclick=\"setPV('${o[0]}')\">${o[1]}<\/button>`).join('');\n  render();\n}\nfunction setPV(m){PV=m;try{localStorage.setItem('pvtask',m)}catch(e){}layout()}\naddEventListener('resize',layout);\nlayout();\n\nfunction openHash(hh){const h=hh!=null?hh:decodeURIComponent(location.hash.slice(1));if(!h)return;const t=TASKS.find(x=>'k'+x.id===h);if(t){stack=['list',h];render()}}\naddEventListener('hashchange',openHash);openHash();\n/* ===== indizio di scorrimento ===== */\n(function(){const mn=document.getElementById('mn'),h=document.getElementById('morehint');\n  function upd(){const more=mn.scrollHeight-mn.clientHeight-mn.scrollTop>24,up=mn.scrollTop>8;\n    mn.classList.toggle('more',more);mn.classList.toggle('up',up);h.classList.toggle('show',more&&mn.scrollTop<40)}\n  mn.addEventListener('scroll',upd,{passive:true});\n  new MutationObserver(()=>requestAnimationFrame(upd)).observe(mn,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});\n  new ResizeObserver(upd).observe(mn);addEventListener('resize',upd);setTimeout(upd,50);\n})();\n\n/* ===== Edit: un solo pulsante nelle schede finali (utente, fornitore, software, device, VLAN) ===== */\n(function(){\n  const LS='edits2:Tasks';\n  let E={};try{E=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}\n  const store=()=>{try{localStorage.setItem(LS,JSON.stringify(E))}catch(e){}};\n  const PEN='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13 7l4 4\"/><\/svg>';\n  const route=()=>{try{return typeof cur==='function'?cur():''}catch(e){return ''}};\n  const say=m=>{try{toast(m)}catch(e){}};\n  const scopes=()=>{const L=[];const sh=document.querySelector('#ov .sheet');if(sh&&sh.querySelector('.ed-own'))L.push(sh);const mn=document.getElementById('mn');if(mn.querySelector('.ed-own'))L.push(mn);return L};\n  function wrapText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const L=[];let n;\n    while(n=w.nextNode()){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(p.closest('svg'))continue;if(p.children.length)L.push(n)}\n    L.forEach(t=>{const s=document.createElement('span');t.replaceWith(s);s.appendChild(t)})}\n  const leaves=el=>[...el.querySelectorAll('*')].filter(x=>!x.children.length&&x.textContent.trim()&&!x.closest('svg,.av,.sem,.dbar,.bar2,.rbar,h4')&&!['BUTTON','INPUT'].includes(x.tagName));\n  function keyOf(sc,el,i){return route()+'|'+(sc.id||'sheet')+'|'+i+'|'+el.textContent.replace(/\\s+/g,' ').trim().slice(0,40)}\n  function btnHTML(){return `<button class=\"edpage\" type=\"button\">${PEN}Edit<\/button>`}\n  function place(sc){const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child, #hd .edslot'):null);\n    if(!slot)return;slot.classList.add('edslot');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function start(sc,slot){sc._orig=[...sc.querySelectorAll('.ed-own')].map(x=>x.innerHTML);sc.classList.add('editmode');\n    sc.querySelectorAll('.ed-own').forEach(o=>{[o,...o.querySelectorAll('[onclick]')].forEach(x=>{if(x.getAttribute('onclick')){x.dataset.oc=x.getAttribute('onclick');x.removeAttribute('onclick')}});wrapText(o);leaves(o).forEach(x=>x.setAttribute('contenteditable','true'))});\n    slot.innerHTML='<span class=\"edgrp\"><button class=\"edpage\" type=\"button\">Cancel<\/button><button class=\"edpage sv\" type=\"button\">Save<\/button><\/span>';\n    const [cn,sv]=slot.querySelectorAll('button');\n    cn.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach((o,i)=>o.innerHTML=sc._orig[i]);end(sc,slot)};\n    sv.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach(o=>{o.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));\n      [o,...o.querySelectorAll('[data-oc]')].forEach(x=>{if(x.dataset.oc){x.setAttribute('onclick',x.dataset.oc);delete x.dataset.oc}});E[o.dataset.ek]=o.innerHTML});store();end(sc,slot);say('Change saved')};\n    const f=sc.querySelector('.ed-own [contenteditable]');if(f)f.focus()}\n  function end(sc,slot){sc.classList.remove('editmode');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function decorate(){scopes().forEach(sc=>{if(sc.classList.contains('editmode'))return;let fresh=false;\n    sc.querySelectorAll('.ed-own').forEach((o,i)=>{if(o.dataset.ek)return;fresh=true;o.dataset.ek=keyOf(sc,o,i);if(E[o.dataset.ek]!=null)o.innerHTML=E[o.dataset.ek]});\n    const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child'):null);\n    if(slot&&!slot.querySelector('.edpage'))place(sc)})}\n  const obs=new MutationObserver(()=>{obs.disconnect();try{decorate()}finally{watch()}});\n  const watch=()=>['mn','ov','hd'].forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el,{childList:true,subtree:true})});\n  watch();setTimeout(()=>{obs.disconnect();decorate();watch()},60);\n})();\n\n\naddEventListener('message',e=>{const d=e.data||{};if('hash' in d){try{closeOv()}catch(x){}if(d.hash)openHash(d.hash);else{stack=[stack[0]];render()}}});\n\n(function(){const o=document.getElementById('ov');if(!o)return;let last=null;new MutationObserver(()=>{const v=o.classList.contains('show');if(v!==last){last=v;parent.postMessage({ov:v},'*')}}).observe(o,{attributes:true,attributeFilter:['class']})})();\n\nconst _rF=render;render=function(){_rF();try{parent.postMessage({feed:'ot',items:TASKS.map(t=>({id:t.id,t:t.t,p:t.p,due:t.due,st:t.st,tk:t.links.filter(l=>l[0]==='tk').map(l=>l[1])}))},'*')}catch(e){}};try{parent.postMessage({feed:'ot',items:TASKS.map(t=>({id:t.id,t:t.t,p:t.p,due:t.due,st:t.st,tk:t.links.filter(l=>l[0]==='tk').map(l=>l[1])}))},'*')}catch(e){}\n\n(function(){const f=()=>document.documentElement.classList.toggle('phone',innerWidth<600);f();addEventListener('resize',f)})();\n\nconst _rS=render;render=function(){_rS();try{localStorage.setItem('ship:ot',JSON.stringify({v:3,t:Date.now(),d:{'TASKS':TASKS,'DONE':DONE}}))}catch(e){}};\n<\/script>\n<\/body><\/html>\n"</script>
<script type="application/json" id="sec-ck">"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Checklists<\/title>\n<style>\n:root{\n  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;\n  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;\n  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;\n  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;\n  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;\n  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;\n  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;\n  --f:-apple-system,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,Arial,sans-serif;\n  --m:\"SF Mono\",\"Cascadia Mono\",Consolas,ui-monospace,monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}\n#stage{position:fixed;inset:0}\n.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}\n.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}\n.framed .pv{display:flex}\n.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}\n.framed .app{border-radius:calc(22px / var(--s))}\n.wrap{position:absolute;inset:0;display:flex;flex-direction:column}\n/* ===== temi ===== */\n.sky{background:\n  radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 62%,#e8eefc 60%,transparent),\n  radial-gradient(1.5px 1.5px at 83% 31%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 86%,#e8eefc 60%,transparent),\n  radial-gradient(1px 1px at 71% 12%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 44% 44%,#f3f0e6 60%,transparent),\n  radial-gradient(1px 1px at 93% 58%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 80%,#e8eefc 60%,transparent),\n  radial-gradient(ellipse at 50% 125%,rgba(201,168,106,.22) 0%,transparent 55%),\n  linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 60%,var(--night-3) 100%)}\n.deck{color:var(--cream);background:\n  radial-gradient(ellipse at 50% -10%,rgba(230,211,166,.16),transparent 55%),\n  repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,rgba(255,255,255,.03) 2px 5px),\n  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px),\n  linear-gradient(175deg,var(--wood-1) 0%,var(--wood-2) 45%,var(--wood-3) 100%)}\n.stone{color:var(--ink);background:\n  radial-gradient(1px 1px at 20% 30%,rgba(0,0,0,.14) 50%,transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.35) 50%,transparent),\n  linear-gradient(180deg,var(--stone-1),var(--stone-2));background-size:7px 7px,11px 11px,auto}\n.paperbg{color:var(--ink);background:linear-gradient(180deg,var(--cream),var(--cream-2))}\n/* ===== header ===== */\n.hd{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:22px 20px 10px;flex:none}\n.ttl{justify-self:center;font:800 32px var(--f);letter-spacing:.16em;padding-bottom:4px;border-bottom:2px solid var(--brass);white-space:nowrap}\n.ttl.s{font-size:24px}\n.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.stone .hb,.paperbg .hb{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.15)}\n.hb svg{width:22px;height:22px}\n.cmpb{position:relative;justify-self:end;width:56px;height:56px;border-radius:50% t&&dleft(c.next)<=10?hero(stOf(c),(c.items.length-n)+' items to close by '+fmtD(c.next)):n===c.items.length?hero('g','all items completed'):'')+\n  `<div class=\"swcols\">`+\n  card('ck','Checklist',`<div class=\"kv\"><span>Name<\/span><b>${c.n}<\/b><span>Type<\/span><b>${c.g}<\/b><span>Frequency<\/span><b>${c.cad}<\/b><span>Next<\/span><b>${fmtD(c.next)}<\/b><span>Source<\/span><b>${c.src}<\/b><span>Owner<\/span><b>IT Manager<\/b><\/div>`)+\n  card('doc','Description',`<div class=\"desc\">${c.d}<\/div>`)+\n  card('ot','Items',c.items.map((it,i)=>`<div class=\"chk${DONE[c.id+'_'+i]?' done':''}\"><span class=\"box\" onclick=\"DONE['${c.id}_${i}']=!DONE['${c.id}_${i}'];render()\">${DONE[c.id+'_'+i]?ic('check',3):''}<\/span><span class=\"ct\" style=\"flex:1\" onclick=\"DONE['${c.id}_${i}']=!DONE['${c.id}_${i}'];render()\">${it[0]}<\/span>${it[1]?`<span class=\"golink\" onclick=\"${linkJS(it[1])}\" title=\"Open\">${ic('link')}<\/span>`:''}<\/div>`).join(''),n+'/'+c.items.length)+\n  card('tk','Previous runs',c.runs.length?c.runs.map(r=>`<div class=\"li\"><span class=\"t\"><b>${r}<\/b><span>completed<\/span><\/span><\/div>`).join(''):'<div class=\"empty\" style=\"padding:8px 0\">No runs yet<\/div>')+\n  `<\/div><div class=\"dbtns\" style=\"max-width:520px\">${rec?`<button class=\"pr\" onclick=\"closeRun('${c.id}')\">Close and restart<\/button>`:`<button class=\"pr\" onclick=\"closeRun('${c.id}')\">Mark completed<\/button>`}<\/div>`}\nfunction closeRun(id){const c=CL.find(x=>x.id===id);c.runs.unshift(new Date(2026,8,25).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}));c.items.forEach((_,i)=>delete DONE[id+'_'+i]);render();toast(c.g==='Recurring'?'Run recorded, checklist reset':'Checklist completed')}\n\nfunction render(){const k=cur(),c=k.startsWith('c-')?CL.find(x=>'c-'+x.id===k):null;frame(c?c.n.toUpperCase():'CHECKLISTS',c?clView(c):listView())}\n/* ============ OVERLAY ============ */\nfunction ov(html){const o=$('ov');o.innerHTML=`<div class=\"dim\" onclick=\"closeOv()\"><\/div>`+html;o.className='ov show'}\nfunction closeOv(){$('ov').className='ov';$('ov').innerHTML=''}\nfunction toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);setTimeout(()=>t.remove(),1800)}\n\nfunction sheet(html,sky){ov(`<div class=\"sheet${sky?' sk':''}\"><div class=\"grab\"><\/div>${html}<\/div>`)}\n\n/* ===== SHIP: salvataggio dati sezione ===== */\ntry{const x=JSON.parse(localStorage.getItem('ship:ck')||'null');if(x&&x.d&&x.v===3){if(x.d['CL'])(Array.isArray(CL)?CL.splice(0,CL.length,...x.d['CL']):Object.assign(CL,x.d['CL']));if(x.d['DONE'])(Array.isArray(DONE)?DONE.splice(0,DONE.length,...x.d['DONE']):Object.assign(DONE,x.d['DONE']))}}catch(e){}\n/* ============ LAYOUT TABLET (2:3 verticale, 3:2 orizzontale) ============ */\nlet LAND=false,PV='auto';\ntry{PV=localStorage.getItem('pvChecklists')||(innerWidth>=1400&&matchMedia('(pointer:fine)').matches?'p':'auto')}catch(e){PV='auto'}\nfunction layout(){PV='auto';\n  const vw=innerWidth,vh=innerHeight,app=$('app'),fr=$('frame');let x=0,y=0,w=vw,h=vh;\n  /* dimensioni reali: niente ingrandimento. In anteprima: Surface Go 4 (1920x1280 al 150% = 853x1280 CSS px), rimpicciolito solo per starci nello schermo */\n  let W=vw,H=vh,s=1;\n  if(PV!=='auto'){W=PV==='p'?853:1280;H=PV==='p'?1280:853;const m=40;s=Math.min(1,(vw-2*m)/W,(vh-2*m)/H);w=W*s;h=H*s;x=(vw-w)/2;y=(vh-h)/2}\n  LAND=W>H;\n  app.style.cssText=`--W:${W};--H:${H};--s:${s};left:${x}px;top:${y}px`;\n  fr.style.cssText=PV==='auto'?'display:none':`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;\n  document.body.classList.toggle('framed',PV!=='auto');\n  $('pv').innerHTML=[['p','Portrait'],['l','Landscape'],['auto','Full screen']].map(o=>`<button class=\"${PV===o[0]?'on':''}\" onclick=\"setPV('${o[0]}')\">${o[1]}<\/button>`).join('');\n  render();\n}\nfunction setPV(m){PV=m;try{localStorage.setItem('pvChecklists',m)}catch(e){}layout()}\naddEventListener('resize',layout);\nlayout();\n\nfunction openHash(hh){const h=hh!=null?hh:decodeURIComponent(location.hash.slice(1));if(!h)return;const c=CL.find(x=>'c-'+x.id===h||x.id===h);if(c){stack=['list','c-'+c.id];render()}}\naddEventListener('hashchange',openHash);openHash();\n/* ===== indizio di scorrimento ===== */\n(function(){const mn=document.getElementById('mn'),h=document.getElementById('morehint');\n  function upd(){const more=mn.scrollHeight-mn.clientHeight-mn.scrollTop>24,up=mn.scrollTop>8;\n    mn.classList.toggle('more',more);mn.classList.toggle('up',up);h.classList.toggle('show',more&&mn.scrollTop<40)}\n  mn.addEventListener('scroll',upd,{passive:true});\n  new MutationObserver(()=>requestAnimationFrame(upd)).observe(mn,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});\n  new ResizeObserver(upd).observe(mn);addEventListener('resize',upd);setTimeout(upd,50);\n})();\n\n/* ===== Edit: un solo pulsante nelle schede finali (utente, fornitore, software, device, VLAN) ===== */\n(function(){\n  const LS='edits2:Checklists';\n  let E={};try{E=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}\n  const store=()=>{try{localStorage.setItem(LS,JSON.stringify(E))}catch(e){}};\n  const PEN='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13 7l4 4\"/><\/svg>';\n  const route=()=>{try{return typeof cur==='function'?cur():''}catch(e){return ''}};\n  const say=m=>{try{toast(m)}catch(e){}};\n  const scopes=()=>{const L=[];const sh=document.querySelector('#ov .sheet');if(sh&&sh.querySelector('.ed-own'))L.push(sh);const mn=document.getElementById('mn');if(mn.querySelector('.ed-own'))L.push(mn);return L};\n  function wrapText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const L=[];let n;\n    while(n=w.nextNode()){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(p.closest('svg'))continue;if(p.children.length)L.push(n)}\n    L.forEach(t=>{const s=document.createElement('span');t.replaceWith(s);s.appendChild(t)})}\n  const leaves=el=>[...el.querySelectorAll('*')].filter(x=>!x.children.length&&x.textContent.trim()&&!x.closest('svg,.av,.sem,.dbar,.bar2,.rbar,h4')&&!['BUTTON','INPUT'].includes(x.tagName));\n  function keyOf(sc,el,i){return route()+'|'+(sc.id||'sheet')+'|'+i+'|'+el.textContent.replace(/\\s+/g,' ').trim().slice(0,40)}\n  function btnHTML(){return `<button class=\"edpage\" type=\"button\">${PEN}Edit<\/button>`}\n  function place(sc){const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child, #hd .edslot'):null);\n    if(!slot)return;slot.classList.add('edslot');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function start(sc,slot){sc._orig=[...sc.querySelectorAll('.ed-own')].map(x=>x.innerHTML);sc.classList.add('editmode');\n    sc.querySelectorAll('.ed-own').forEach(o=>{[o,...o.querySelectorAll('[onclick]')].forEach(x=>{if(x.getAttribute('onclick')){x.dataset.oc=x.getAttribute('onclick');x.removeAttribute('onclick')}});wrapText(o);leaves(o).forEach(x=>x.setAttribute('contenteditable','true'))});\n    slot.innerHTML='<span class=\"edgrp\"><button class=\"edpage\" type=\"button\">Cancel<\/button><button class=\"edpage sv\" type=\"button\">Save<\/button><\/span>';\n    const [cn,sv]=slot.querySelectorAll('button');\n    cn.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach((o,i)=>o.innerHTML=sc._orig[i]);end(sc,slot)};\n    sv.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach(o=>{o.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));\n      [o,...o.querySelectorAll('[data-oc]')].forEach(x=>{if(x.dataset.oc){x.setAttribute('onclick',x.dataset.oc);delete x.dataset.oc}});E[o.dataset.ek]=o.innerHTML});store();end(sc,slot);say('Change saved')};\n    const f=sc.querySelector('.ed-own [contenteditable]');if(f)f.focus()}\n  function end(sc,slot){sc.classList.remove('editmode');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function decorate(){scopes().forEach(sc=>{if(sc.classList.contains('editmode'))return;let fresh=false;\n    sc.querySelectorAll('.ed-own').forEach((o,i)=>{if(o.dataset.ek)return;fresh=true;o.dataset.ek=keyOf(sc,o,i);if(E[o.dataset.ek]!=null)o.innerHTML=E[o.dataset.ek]});\n    const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child'):null);\n    if(slot&&!slot.querySelector('.edpage'))place(sc)})}\n  const obs=new MutationObserver(()=>{obs.disconnect();try{decorate()}finally{watch()}});\n  const watch=()=>['mn','ov','hd'].forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el,{childList:true,subtree:true})});\n  watch();setTimeout(()=>{obs.disconnect();decorate();watch()},60);\n})();\n\n\naddEventListener('message',e=>{const d=e.data||{};if('hash' in d){try{closeOv()}catch(x){}if(d.hash)openHash(d.hash);else{stack=[stack[0]];render()}}});\n\n(function(){const o=document.getElementById('ov');if(!o)return;let last=null;new MutationObserver(()=>{const v=o.classList.contains('show');if(v!==last){last=v;parent.postMessage({ov:v},'*')}}).observe(o,{attributes:true,attributeFilter:['class']})})();\n\nconst _rF=render;render=function(){_rF();try{parent.postMessage({feed:'ck',items:CL.map(c=>({id:c.id,n:c.n,next:c.next,done:cnt(c),tot:c.items.length}))},'*')}catch(e){}};try{parent.postMessage({feed:'ck',items:CL.map(c=>({id:c.id,n:c.n,next:c.next,done:cnt(c),tot:c.items.length}))},'*')}catch(e){}\n\n(function(){const f=()=>document.documentElement.classList.toggle('phone',innerWidth<600);f();addEventListener('resize',f)})();\n\nconst _rS=render;render=function(){_rS();try{localStorage.setItem('ship:ck',JSON.stringify({v:3,t:Date.now(),d:{'CL':CL,'DONE':DONE}}))}catch(e){}};\n<\/script>\n<\/body><\/html>\n"</script>
<script type="application/json" id="sec-pj">"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Projects<\/title>\n<style>\n:root{\n  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;\n  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;\n  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;\n  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;\n  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;\n  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;\n  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;\n  --f:-apple-system,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,Arial,sans-serif;\n  --m:\"SF Mono\",\"Cascadia Mono\",Consolas,ui-monospace,monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}\n#stage{position:fixed;inset:0}\n.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}\n.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}\n.framed .pv{display:flex}\n.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}\n.framed .app{border-radius:calc(22px / var(--s))}\n.wrap{position:absolute;inset:0;display:flex;flex-direction:column}\n/* ===== temi ===== */\n.sky{background:\n  radial-gradient(1px 1px at 12% 18%,#fff 60%,trans "sem sm\" style=\"background:rgba(242,235,221,.45)\"><\/span>':sem(p.s,1)}${p.st}<\/span>`;\n\nfunction listView(){const act=PJ.filter(p=>p.st==='In progress').length;\n  const row=p=>`<div class=\"chk tkrow\" onclick=\"go('p-${p.id}')\"><span class=\"ct\" style=\"flex:1\">${p.n}<small>${stp(p)} \u00b7 ${p.own} \u00b7 ends ${fmtD(p.end)}<\/small>\n    <span class=\"rbar\" style=\"display:block;margin-top:7px;max-width:420px\"><i style=\"width:${pct(p)}%\"><\/i><\/span><\/span><span class=\"cnt\">${pct(p)}%<\/span><span class=\"chev\">${ic('chev')}<\/span><\/div>`;\n  return hero('a',act+' projects in progress \u00b7 '+PJ.filter(p=>/CAPEX/.test(p.bud)).length+' waiting for budget')+\n  `<div class=\"xbar\" style=\"justify-content:flex-end\"><button class=\"xbtn pr\" onclick=\"toast('Nuovo progetto: prossimo passo')\">${ic('plus',2.4)}New project<\/button><\/div>\n   <div class=\"paper\"><h3>Projects<small>${PJ.length}<\/small><\/h3>${PJ.map(row).join('')}<\/div>`}\nfunction pjView(p){\n  return (/CAPEX/.test(p.bud)?hero('a','budget to approve ('+p.bud+')'):'')+\n  `<div class=\"swcols\">`+\n  card('pj','Project',`<div class=\"kv\"><span>Name<\/span><b>${p.n}<\/b><span>Status<\/span><b>${p.st}<\/b><span>Owner<\/span><b>${p.own}<\/b><span>Start<\/span><b>${fmtD(p.start)}<\/b><span>Planned end<\/span><b>${fmtD(p.end)}<\/b><span>Budget<\/span><b>${p.bud}<\/b><\/div>`)+\n  card('doc','Description',`<div class=\"desc\">${p.d}<\/div>`)+\n  card('ot','Progress',`<div class=\"bigp\">${pct(p)}%<\/div><div class=\"rbar\" style=\"margin:4px 0 8px\"><i style=\"width:${pct(p)}%\"><\/i><\/div>`+p.ph.map((f,i)=>{const d=f[1]||DONE[p.id+i];return `<button class=\"chk${d?' done':''}\" onclick=\"${f[1]?'':`DONE['${p.id}${i}']=!DONE['${p.id}${i}'];render()`}\"><span class=\"box\">${d?ic('check',3):''}<\/span><span class=\"ct\">${f[0]}<\/span><\/button>`}).join(''))+\n  card('link','Links',p.links.map(l=>`<div class=\"li\" style=\"cursor:pointer\" onclick=\"${linkJS(l)}\"><span class=\"t = LAYOUT TABLET (2:3 verticale, 3:2 orizzontale) ============ */\nlet LAND=false,PV='auto';\ntry{PV=localStorage.getItem('pvProjects')||(innerWidth>=1400&&matchMedia('(pointer:fine)').matches?'p':'auto')}catch(e){PV='auto'}\nfunction layout(){PV='auto';\n  const vw=innerWidth,vh=innerHeight,app=$('app'),fr=$('frame');let x=0,y=0,w=vw,h=vh;\n  /* dimensioni reali: niente ingrandimento. In anteprima: Surface Go 4 (1920x1280 al 150% = 853x1280 CSS px), rimpicciolito solo per starci nello schermo */\n  let W=vw,H=vh,s=1;\n  if(PV!=='auto'){W=PV==='p'?853:1280;H=PV==='p'?1280:853;const m=40;s=Math.min(1,(vw-2*m)/W,(vh-2*m)/H);w=W*s;h=H*s;x=(vw-w)/2;y=(vh-h)/2}\n  LAND=W>H;\n  app.style.cssText=`--W:${W};--H:${H};--s:${s};left:${x}px;top:${y}px`;\n  fr.style.cssText=PV==='auto'?'display:none':`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;\n  document.body.classList.toggle('framed',PV!=='auto');\n  $('pv').innerHTML=[['p','Portrait'],['l','Landscape'],['auto','Full screen']].map(o=>`<button class=\"${PV===o[0]?'on':''}\" onclick=\"setPV('${o[0]}')\">${o[1]}<\/button>`).join('');\n  render();\n}\nfunction setPV(m){PV=m;try{localStorage.setItem('pvProjects',m)}catch(e){}layout()}\naddEventListener('resize',layout);\nlayout();\n\nfunction openHash(hh){const h=hh!=null?hh:decodeURIComponent(location.hash.slice(1));if(!h)return;const p=PJ.find(x=>'p-'+x.id===h||x.id===h);if(p){stack=['list','p-'+p.id];render()}}\naddEventListener('hashchange',openHash);openHash();\n/* ===== indizio di scorrimento ===== */\n(function(){const mn=document.getElementById('mn'),h=document.getElementById('morehint');\n  function upd(){const more=mn.scrollHeight-mn.clientHeight-mn.scrollTop>24,up=mn.scrollTop>8;\n    mn.classList.toggle('more',more);mn.classList.toggle('up',up);h.classList.toggle('show',more&&mn.scrollTop<40)}\n  mn.addEventListener('scroll',upd,{passive:true});\n  new MutationObserver(()=>requestAnimationFrame(upd)).observe(mn,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});\n  new ResizeObserver(upd).observe(mn);addEventListener('resize',upd);setTimeout(upd,50);\n})();\n\n/* ===== Edit: un solo pulsante nelle schede finali (utente, fornitore, software, device, VLAN) ===== */\n(function(){\n  const LS='edits2:Projects';\n  let E={};try{E=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}\n  const store=()=>{try{localStorage.setItem(LS,JSON.stringify(E))}catch(e){}};\n  const PEN='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13 7l4 4\"/><\/svg>';\n  const route=()=>{try{return typeof cur==='function'?cur():''}catch(e){return ''}};\n  const say=m=>{try{toast(m)}catch(e){}};\n  const scopes=()=>{const L=[];const sh=document.querySelector('#ov .sheet');if(sh&&sh.querySelector('.ed-own'))L.push(sh);const mn=document.getElementById('mn');if(mn.querySelector('.ed-own'))L.push(mn);return L};\n  function wrapText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const L=[];let n;\n    while(n=w.nextNode()){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(p.closest('svg'))continue;if(p.children.length)L.push(n)}\n    L.forEach(t=>{const s=document.createElement('span');t.replaceWith(s);s.appendChild(t)})}\n  const leaves=el=>[...el.querySelectorAll('*')].filter(x=>!x.children.length&&x.textContent.trim()&&!x.closest('svg,.av,.sem,.dbar,.bar2,.rbar,h4')&&!['BUTTON','INPUT'].includes(x.tagName));\n  function keyOf(sc,el,i){return route()+'|'+(sc.id||'sheet')+'|'+i+'|'+el.textContent.replace(/\\s+/g,' ').trim().slice(0,40)}\n  function btnHTML(){return `<button class=\"edpage\" type=\"button\">${PEN}Edit<\/button>`}\n  function place(sc){const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child, #hd .edslot'):null);\n    if(!slot)return;slot.classList.add('edslot');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function start(sc,slot){sc._orig=[...sc.querySelectorAll('.ed-own')].map(x=>x.innerHTML);sc.classList.add('editmode');\n    sc.querySelectorAll('.ed-own').forEach(o=>{[o,...o.querySelectorAll('[onclick]')].forEach(x=>{if(x.getAttribute('onclick')){x.dataset.oc=x.getAttribute('onclick');x.removeAttribute('onclick')}});wrapText(o);leaves(o).forEach(x=>x.setAttribute('contenteditable','true'))});\n    slot.innerHTML='<span class=\"edgrp\"><button class=\"edpage\" type=\"button\">Cancel<\/button><button class=\"edpage sv\" type=\"button\">Save<\/button><\/span>';\n    const [cn,sv]=slot.querySelectorAll('button');\n    cn.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach((o,i)=>o.innerHTML=sc._orig[i]);end(sc,slot)};\n    sv.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach(o=>{o.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));\n      [o,...o.querySelectorAll('[data-oc]')].forEach(x=>{if(x.dataset.oc){x.setAttribute('onclick',x.dataset.oc);delete x.dataset.oc}});E[o.dataset.ek]=o.innerHTML});store();end(sc,slot);say('Change saved')};\n    const f=sc.querySelector('.ed-own [contenteditable]');if(f)f.focus()}\n  function end(sc,slot){sc.classList.remove('editmode');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function decorate(){scopes().forEach(sc=>{if(sc.classList.contains('editmode'))return;let fresh=false;\n    sc.querySelectorAll('.ed-own').forEach((o,i)=>{if(o.dataset.ek)return;fresh=true;o.dataset.ek=keyOf(sc,o,i);if(E[o.dataset.ek]!=null)o.innerHTML=E[o.dataset.ek]});\n    const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child'):null);\n    if(slot&&!slot.querySelector('.edpage'))place(sc)})}\n  const obs=new MutationObserver(()=>{obs.disconnect();try{decorate()}finally{watch()}});\n  const watch=()=>['mn','ov','hd'].forEach(id=>{const e
