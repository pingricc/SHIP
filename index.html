<script type="application/json" id="sec-net">"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Network<\/title>\n<style>\n:root{\n  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;\n  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;\n  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;\n  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;\n  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;\n  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;\n  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;\n  --f:-apple-system,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,Arial,sans-serif;\n  --m:\"SF Mono\",\"Cascadia Mono\",Consolas,ui-monospace,monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}\n#stage{position:fixed;inset:0}\n.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}\n.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}\n.framed .pv{display:flex}\n.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}\n.framed .app{border-radius:calc(22px / var(--s))}\n.wrap{position:absolute;inset:0;display:flex;flex-direction:column}\n/* ===== temi ===== */\n.sky{background:\n  radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 62%,#e8eefc 60%,transparent),\n  radial-gradient(1.5px 1.5px at 83% 31%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 86%,#e8eefc 60%,transparent),\n  radial-gradient(1px 1px at 71% 12%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 44% 44%,#f3f0e6 60%,transparent),\n  radial-gradient(1px 1px at 93% 58%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 80%,#e8eefc 60%,transparent),\n  radial-gradient(ellipse at 50% 125%,rgba(201,168,106,.22) 0%,transparent 55%),\n  linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 60%,var(--night-3) 100%)}\n.deck{color:var(--cream);background:\n  radial-gradient(ellipse at 50% -10%,rgba(230,211,166,.16),transparent 55%),\n  repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,rgba(255,255,255,.03) 2px 5px),\n  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px),\n  linear-gradient(175deg,var(--wood-1) 0%,var(--wood-2) 45%,var(--wood-3) 100%)}\n.stone{color:var(--ink);background:\n  radial-gradient(1px 1px at 20% 30%,rgba(0,0,0,.14) 50%,transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.35) 50%,transparent),\n  linear-gradient(180deg,var(--stone-1),var(--stone-2));background-size:7px 7px,11px 11px,auto}\n.paperbg{color:var(--ink);background:linear-gradient(180deg,var(--cream),var(--cream-2))}\n/* ===== header ===== */\n.hd{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:22px 20px 10px;flex:none}\n.ttl{justify-self:center;font:800 32px var(--f);letter-spacing:.16em;padding-bottom:4px;border-bottom:2px solid var(--brass);white-space:nowrap}\n.ttl.s{font-size:24px}\n.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.stone .hb,.paperbg .hb{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.15)}\n.hb svg{width:22px;height:22px}\n.cmpb{position:relative;justify-self:end;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;\n  background:radial-gradient(circle at 35% 30%,#B7C6A9,var(--sage) 55%,var(--sage-d));box-shadow:0 0 0 2px rgba(220,228,212,.55),0 6px 16px rgba(0,0,0,.4)}\n.cmpb svg{width:27px;height:27px}\n.badge{position:absolute;top:-4px;right:-4px;font:700 10px var(--m);font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:1px 5px}\n.hdr{justify-self:end}\n/* ===== main ===== */\n.mn{flex:1;overflow-y:auto;padding:8px 20px 130px;-webkit-overflow-scrolling:touch}\n.mn.fix{overflow:hidden;position:relative;padding:0}\n.fade{animation:fd .28s ease}\n@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n/* ===== isola: nessuno stile ===== */\n.island{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 9px;border-radius:999px;z-index:30;\n  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.3)}\n.stone .island,.paperbg .island{background:rgba(40,40,40,.28)}\n.ib{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}\n.ib svg{width:24px;height:24px}\n.ib.on{background:rgba(255,255,255,.34)}\n.ib em{position:absolute;top:0;right:-3px;font:700 10px var(--m);font-style:normal;background:#fff;color:var(--ink);border-radius:999px;padding:1px 5px}\n/* ===== atlante ===== */\n/* verticale: costellazione a righe, niente posizioni assolute -> niente sovrapposizioni */\n.const{position:absolute;inset:0 16px 104px;display:flex;flex-direction:column;justify-content:space-evenly;container-type:size;padding:6px 0}\n.const .hemi{top:50%}\n.crow{position:relative;display:flex;justify-content:center;gap:max(24px,14cqw)}\n.crow.two{justify-content:space-between;padding:0 4cqw}\n.const .equator{position:relative;top:auto;flex:none}\n.const .st{position:relative;transform:none;left:auto;top:auto}\n/* orizzontale: colonne di schede con anteprima */\n.segv{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);margin:0 0 14px}\n.segv button{font:700 13.5px var(--f);letter-spacing:.04em;padding:8px 16px;border-radius:999px;opacity:.75}\n.segv button.on{background:#fff;color:var(--night-1);opacity:1}\n.mapb{flex:none;display:inline-flex;align-items:center;gap:8px;padding:0 16px;height:46px;border-radius:14px;font:800 13px var(--f);letter-spacing:.06em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.mapb svg{width:22px;height:22px}\n.nfil .srch{height:46px}\n.nmaps{display:grid;gap:6px}.land .nmaps{grid-template-columns:1fr 1fr;gap:16px;align-items:start}.nmaps .sechd:first-child{margin-top:4px}\n.netw{display:grid;gap:14px}.land .netw{grid-template-columns:minmax(0,1fr) 330px;align-items:start}\n.npanel{display:none}.land .npanel{display:block;position:sticky;top:0}\n.map{border-radius:18px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);padding:6px}\n.map svg{display:block;width:100%;height:auto}\n.land .map svg{max-height:calc(var(--H)*1px - 330px)}\n.map .n rect{fill:rgba(27,43,66,.92);stroke:rgba(255,255,255,.35);stroke-width:1}\n.map .n{cursor:pointer}.map .n:hover rect{stroke:#fff}\n.map .n.sel rect{stroke:var(--brass);stroke-width:2.5}\n.map .n text{fill:#fff;font:700 13px var(--f)}.map .n text.s{font:500 11px var(--m);fill:rgba(255,255,255,.65)}\n.map .ln{stroke:rgba(255,255,255,.38);stroke-width:1.6;fill:none}.map .ln.bad{stroke:var(--red);stroke-dasharray:6 5}.map .ln.bk{stroke-dasharray:3 4}\n.map .pt{font:600 10px var(--m);fill:var(--brass-l)}\n.map .vl rect{fill:rgba(143,163,130,.14)}.map .vl.iso rect{stroke-dasharray:5 4}\n.map .cloud{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.3)}\n.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;opacity:.75;margin:8px 4px 0}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{display:inline-block;width:22px;border-top:2px solid rgba(255,255,255,.5)}.legend i.bad{border-top:2px dashed var(--red)}\n.nfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}\n.nfil .srch{flex:1 1 220px;margin:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}.nfil .srch input{color:#fff}.nfil .srch input::placeholder{color:rgba(255,255,255,.55)}\n.nfil .chips{margin:0}\n.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid rgba(255,255,255,.1)}\n.nrow:first-child{border-top:0}.nrow b{font-size:15px}.nrow .ip{font:600 13px var(--m);opacity:.8;text-align:right}\n.nrow .sub{grid-column:2/4;font-size:12.5px;opacity:.65}.nrow.sel b{color:var(--brass-l)}\n.dhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.dhd h2{margin:0;font:800 20px var(--f);letter-spacing:.04em}\n.dnote{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13.5px}\n.dbtns{display:flex;gap:8px;margin-top:14px}.dbtns button{flex:1;padding:10px;border-radius:12px;font:800 13px var(--f);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.dbtns button.pr{background:#fff;color:var(--night-1)}\n.acards{position:absolute;inset:4px 20px 100px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1fr;gap:14px}\n.ac{grid-column:span 3;min-height:0;display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border-radius:18px;overflow:hidden;\n  background:linear-gradient(180deg,rgba(143,163,130,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s}\n.ac.dn{grid-column:span 4;background:linear-gradient(180deg,rgba(201,168,106,.16),rgba(255,255,255,.05));border-color:rgba(230,211,166,.35)}\n.ac:active{transform:scale(.98)}\n.ach{display:flex;align-items:center;gap:10px;font:800 15px var(--f);letter-spacing:.12em}\n.ach svg{width:20px;height:20px;opacity:.9}.ach .go{margin-left:auto;opacity:.5}.ach .go svg{width:18px;height:18px}\n.acn{font-size:14.5px;font-weight:700;line-height:1.3;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1)}\n.acl{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}\n.acr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}\n.acr:first-child{border-top:0}.acr>span:not(.sem){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acr i{flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--m);font-style:normal;opacity:.7}\n.hemi{position:absolute;left:50%;top:52%;width:min(92cqw,96cqh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.10);\n  background:linear-gradient(180deg,rgba(143,163,130,.10) 0%,rgba(143,163,130,.03) 49.8%,rgba(201,168,106,.05) 50.2%,rgba(201,168,106,.14) 100%)}\n.equator{position:absolute;left:0;right:0;top:54%;border-top:1px dashed rgba(255,255,255,.25)}\n.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:210px}\n.sem{width:15px;height:15px;border-radius:50%;flex:none}\n.sem.r{background:var(--red);box-shadow:0 0 0 3px rgba(192,80,60,.3),0 0 18px 6px rgba(192,80,60,.55)}\n.sem.a{background:var(--amber);box-shadow:0 0 0 3px rgba(201,142,46,.3),0 0 18px 6px rgba(201,142,46,.5)}\n.sem.g{background:var(--sage);box-shadow:0 0 0 3px rgba(143,163,130,.3),0 0 18px 6px rgba(143,163,130,.55)}\n.sem.sm{width:10px;height:10px;box-shadow:none}\n.lb{display:inline-flex;align-items:center;gap:8px;font:800 17px var(--f);letter-spacing:.12em;padding:9px 16px;border-radius:999px;color:#fff;\n  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}\n.st:active .lb{transform:scale(.95)}\n.st.dn .lb{background:rgba(230,211,166,.14);border-color:rgba(230,211,166,.45)}\n.lb svg{width:20px;height:20px}\n.tag{font-size:14.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);max-width:210px;line-height:1.25}\n/* ===== componenti cielo ===== */\n.hero{display:flex;align-items:center;gap:10px;margin:4px 2px 14px;font-size:14px;color:#D8E0EA}\n.hero b{color:#fff}\n.gc{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.gc h4{margin:0;font:800 13px var(--f);letter-spacing:.14em;display:flex;align-items:center;gap:8px;text-transform:uppercase}\n.gc h4 small{margin-left:auto;font:600 12px var(--m);letter-spacing:0;opacity:.7}\n.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);width:100%;text-align:left}\n.li:first-of-type{border-top:0}\n.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:700}.li .t span{font-size:12.5px;opacity:.7}\n.chev{opacity:.5}\n.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}\n.cols{columns:2 300px;column-gap:12px}.cols>*{break-inside:avoid}\n.plg{display:grid;gap:0 18px}.land .plg{grid-template-columns:1fr 1fr;align-items:start}.land .plg .sechd:first-child{margin-top:0}\n.tile{position:relative;text-align:left;padding:12px;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);min-height:92px;display:flex;flex-direction:column;gap:4px}\n.tile b{font:800 14px var(--f);letter-spacing:.06em}.tile ath d=\"M9 12l2 2 4-4\"/>',\n  sw:'<rect x=\"4\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"/>',\n  inv:'<path d=\"M3 8l9-5 9 5v8l-9 5-9-5z\"/><path d=\"M3 8l9 5 9-5M12 13v8\"/>',\n  dep:'<path d=\"M4 21V7l6-3v17M10 21V9l10 3v9M3 21h18\"/>',\n  sup:'<path d=\"M3 7h11v9H3zM14 10h4l3 3v3h-7\"/><circle cx=\"7\" cy=\"18\" r=\"2\"/><circle cx=\"17\" cy=\"18\" r=\"2\"/>',\n  rep:'<path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/>',\n  tk:'<path d=\"M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z\"/>',\n  ck:'<rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"/><path d=\"M8 8l1.5 1.5L12 7M8 14l1.5 1.5L12 13M14 8h3M14 14h3\"/>',\n  pj:'<path d=\"M3 7h6l2 2h10v10H3z\"/>',ot:'<circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 2\"/>',\n  back:'<path d=\"M15 5l-7 7 7 7\"/>',map:'<path d=\"M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z\"/><path d=\"M9 4v14M15 6v14\"/>',chev:'<path d=\"M9 5l7 7-7 7\"/>',plus:'<path d=\"M12 5v14M5 12h14\"/>',x:'<path d=\"M6 6l12 12M18 6 6 18\"/>',\n  srch:'<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/>',\n  glob:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><ellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\"/><path d=\"M3 12h18M5 7.5h14M5 16.5h14\"/>',\n  user:'<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6\"/>',\n  wheel:'<rect x=\"4.5\" y=\"3.2\" width=\"15\" height=\"18.3\" rx=\"2.2\"/><path d=\"M9 3.2V2h6v1.2\"/><path d=\"m7.6 9.2 1.5 1.5 2.9-3\"/><path d=\"M13.8 9.5h3\"/><path d=\"m7.6 15.2 1.5 1.5 2.9-3\"/><path d=\"M13.8 15.5h3\"/>',\n  cmp:'<circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2\"/><path d=\"M15.5 8.5 13.2 13.2 8.5 15.5 10.8 10.8Z\" fill=\"currentColor\"/>',\n  check:'<path d=\"M5 12l5 5 9-10\"/>'\n};\nconst TEL='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M6.6 2.8c.6-.3 p:'.50 \u2013 .200',cl:48,s:'g',note:''},\n  {id:50,n:'IPTV',net:'10.0.50.0/24',gw:'10.0.50.1',dhcp:'.20 \u2013 .240',cl:120,s:'g',note:'Multicast active'}],\n};\n\n/* ============ SOLO SCHEDA NETWORK ============ */\nconst $=id=>document.getElementById(id);\nlet stack=['net'];\nconst go=r=>{stack.push(r);render()};\nconst back=()=>{if(stack.length>1)stack.pop();render()};\nconst cur=()=>stack[stack.length-1];\nconst sem=(s,sm)=>`<span class=\"sem ${s}${sm?' sm':''}\"><\/span>`;\nconst hero=(s,txt)=>`<div class=\"hero\">${sem(s)}<span><b>To check:<\/b> ${txt}<\/span><\/div>`;\nconst SECN='NETWORK';const T=t=>{const p=[SECN].concat(t&&t!==SECN?[t]:[]);return `<div class=\"ttlw\"><span class=\"ttl\">ATLAS<\/span><span class=\"tsub\">${p.join(' \u00b7 ')}<\/span><\/div>`};\n/* ===== collegamenti tra le schede dell'Atlante ===== */\nconst SWID={'PMS':'pms','POS':'pos','Door locks':'lock','IPTV':'iptv','PBX':'tel','Email':'mail','Accounting':'cont','Spa bookings':'spa','Backup':'bkp','Antivirus':'av','Intranet':'intra','vCenter':'vc','Endpoint manager':'epm','Web gateway':'wgw','Device management':'mdm'};\nconst DEPID={'Front Office':'fo','Housekeeping':'hk','Food & Beverage':'fb','Spa':'spa','Maintenance':'mn','Administration':'am'};\nconst SUPID={'Alfa Rete':'alfa','Beta Soft':'beta','Gamma TV':'gamma','Delta Print':'delta','Epsilon Tel':'eps','Eta Lock':'eta','Mu Security':'mu','Kappa Wellness':'kappa'};\nconst EMPN=['Anna Bianchi','Giulia Serra','Marco Deiana','Chiara Pinna','Luca Verdi','Rita Melis','Paola Loi','Sara Neri','Davide Mura','Elisa Porcu','Nadia Cossu','Paolo Gialli','Elena Blu','Marco Rosa'];\nconst INVH=['PC-FO-01','PC-FO-02','PC-FO-03','PC-AM-01','PC-AM-02','PC-HK-01','PC-SPA-01','PC-FB-01','PC-MN-01','PRN-FO-01','PRN-HK-01','PRN-AM-01','PRN-FB-01','TEL-HALL-01','TEL-BAR-01','TEL-DECT-05','TAB-FB-01','TAB-FB-02','TAB-SPA-01','HV-01','HV-02','SRV-POS','SRV-IPTV','NAS-01','VM-VCENTER','VM-PMS01','VM-LOCK','VM-PBX','VM-BKP','CLD-MAIL','CLD-ACC','CLD-SPA','CLD-AV','CLD-EPM','CLD-WGW','CLD-MDM'];\nfunction openSec(file,h){if(file==='Network'){if(h){openHash(h)}else{stack=[stack[0]];render()}return}parent.postMessage({open:file,hash:h||''},'*')}\nconst L_SW=n=>SWID[n]?`openSec('Software','${SWID[n]}')`:`toast('${n}: not in Software yet')`;\nconst L_DEP=n=>DEPID[n]?`openSec('Departments','${DEPID[n]}')`:`openSec('Departments','')`;\nconst L_SUP=n=>SUPID[n]?`openSec('Suppliers','${SUPID[n]}')`:`toast('${n}: not in Suppliers yet')`;\nconst L_INV=h=>INVH.includes(h)?`openSec('Inventory','${h}')`:`toast('${h}: not in Inventory yet')`;\nconst L_EMP=n=>EMPN.includes(n)?`openSec('Departments','${n}')`:`toast('${n}: not a registered employee')`;\nconst lnk=(txt,js)=>`<span class=\"xlink\" onclick=\"event.stopPropagation();${js}\">${txt}<\/span>`;\n\nconst newTicket=id=>{closeOv();parent.postMessage({ticket:id||''},'*')};\nfunction render(){\n  const k=cur();let title,body;\n  if(k==='net'){title=T('NETWORK');body=hero('r','2 switches offline')+netBody()}\n  else{title=T('NETWORK MAP');body=hero('r','2 switches offline')+\n    `<div class=\"segv\">${[['l3','Layer 3 \u00b7 VLAN'],['l2','Layer 2 \u00b7 links']].map(t=>`<button class=\"${NM.v===t[0]?'on':''}\" onclick=\"NM.v='${t[0]}';NV.sel=null;render()\">${t[1]}<\/button>`).join('')}<\/div>`+\n    (NM.v==='l3'?mapL3():mapL2())}\n  $('app').className='app sky'+(LAND?' land':'');\n  $('hd').innerHTML=`<button class=\"hb\" onclick=\"${stack.length>1?'back()':\"parent.postMessage({home:1},'*')\"}\">${ic('back',2.2)}<\/button>${title}<span><\/span>`;\n  const mn=$('mn');mn.className='mn fade';mn.innerHTML=body;\n  $('isl').innerHTML=[ic('wheel',1.7),TEL,ic('glob',1.7),ic('srch',2),ic('user')].map((x,i)=>`<button class=\"ib${i===2?' on':''}\" onclick=\"toast('Island: active after merge')\">${x}<\/button>`).join('');\n}\n/* ---- NETWORK: mappa L3, mappa L2, elenco ---- */\nconst NV={v:'ls',sel:null,q:'',t:'All',pb:false};\nconst ndv=id=>D.nd.find(d=>d.id===id);\nfunction netBody(){\n  return `<div class=\"netw\"><div>${netList()}<\/div><div class=\"npanel\"><div class=\"gc\">${NV.sel&&LAND?netDetail(NV.sel):'<div class=\"empty\" style=\"padding:30px 10px\">Tap a device or a VLAN to see details<\/div>'}<\/div><\/div><\/div>`}\nconst esc=t=>String(t).replace(/&/g,'&amp;').replace(/<\/g,'&lt;');\nfunction node(key,x,y,w,title,sub,st,sel){\n  const c={g:'var(--sage)',a:'var(--amber)',r:'var(--red)'}[st]||'rgba(255,255,255,.4)';\n  return `<g class=\"n${sel?' sel':''}\" onclick=\"netSel('${key}')\"><rect x=\"${x-w/2}\" y=\"${y-22}\" width=\"${w}\" height=\"44\" rx=\"10\"/>\n   <circle cx=\"${x-w/2+14}\" cy=\"${y-6}\" r=\"5\" fill=\"${c}\"/><text x=\"${x-w/2+26}\" y=\"${y-2}\">${esc(title)}<\/text><text class=\"s\" x=\"${x-w/2+12}\" y=\"${y+14}\">${esc(sub)}<\/text><\/g>`}\nfunction mapL2(){\n  const pos={},W=800;\n  pos['Fiber A']=[300,40];pos['Fiber B']=[500,40];pos['FW-01']=[400,130];pos['SW-CORE']=[400,230];\n  const acc=D.nd.filter(d=>d.t==='Switch'&&d.id!=='SW-CORE');acc.forEach((d,i)=>pos[d.id]=[100+i*200,350]);\n  D.nd.filter(d=>d.t==='Access point').forEach(d=>{const p=pos[d.up];pos[d.id]=[p[0],470]});\n  let L='';\n  const link=(a,b,port,bad,bk)=>{const [x1,y1]=pos[a],[x2,y2]=pos[b],my=(y1+y2)/2;\n    L+=`<path class=\"ln${bad?' bad':''}${bk?' bk':''}\" d=\"M${x1} ${y1+22} C${x1} ${my},${x2} ${my},${x2} ${y2-22}\"/>`;\n    if(port)L+=`<text class=\"pt\" x=\"${(x1+x2)/2+6}\" y=\"${my+4}\">${esc(port)}<\/text>`};\n  link('Fiber A','FW-01','WAN1');link('Fiber B','FW-01','WAN2',false,true);\n  D.nd.filter(d=>d.up&&d.t!=='Firewall').forEach(d=>link(d.up,d.id,d.port,d.s==='r'||ndv(d.up).s==='r'));\n  const N=D.nd.map(d=>node('d:'+d.id,pos[d.id][0],pos[d.id][1],d.t==='Uplink'?130:150,d.id,d.t==='Uplink'?d.loc:d.ip,d.s,NV.sel==='d:'+d.id)).join('');\n  return `<div class=\"map\"><svg viewBox=\"0 0 ${W} 510\">${L}${N}<\/svg><\/div>\n   <div class=\"legend\"><span>${sem('g',1)}ok<\/span><span>${sem('a',1)}warning<\/span><span>${sem('r',1)}offline<\/span><span><i><\/i>cable<\/span><span><i class=\"bad\"><\/i>broken link<\/span><span style=\"font-family:var(--m);color:var(--brass-l)\">1 \u2194 24<\/span><span>upstream port \u2194 local port<\/span><\/div>`}\nfunction mapL3(){\n  const W=800;let L='',N='';\n  N+=`<ellipse class=\"cloud\" cx=\"400\" cy=\"42\" rx=\"120\" ry=\"28\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" style=\"fill:#fff;font:800 13px var(--f);letter-spacing:.12em\">INTERNET<\/text>`;\n  L+=`<path class=\"ln\" d=\"M340 66 L370 118\"/><path class=\"ln bk\" d=\"M460 66 L430 118\"/><text class=\"pt\" x=\"300\" y=\"98\">WAN1 \u00b7 Fiber A<\/text><text class=\"pt\" x=\"440\" y=\"98\">WAN2 \u00b7 Fiber B<\/text>`;\n  N+=node('d:FW-01',400,140,190,'FW-01 \u00b7 gateway','inter-VLAN routing','g',NV.sel==='d:FW-01');\n  L+=`<path class=\"ln\" d=\"M400 162 L400 205\"/><path class=\"ln\" d=\"M80 205 L720 205\"/>`;\n  const n=D.vl.length,step=640/(n-1);\n  D.vl.forEach((v,i)=>{const x=80+i*step,y=300;\n    L+=`<path class=\"ln${v.iso?' bk':''}\" d=\"M${x} 205 L${x} ${y-50}\"/><text class=\"pt\" x=\"${x+6}\" y=\"232\">${v.gw.split('.').slice(-1)[0]==='1'?'.1':''}<\/text>`;\n    const c={g:'var(--sage)',a:'var(--amber)',r:'var(--red)'}[v.s],sel=NV.sel==='v:'+v.id;\n    N+=`<g class=\"n vl${v.iso?' iso':''}${sel?' sel':''}\" onclick=\"netSel('v:${v.id}')\"><rect x=\"${x-70}\" y=\"${y-50}\" width=\"140\" height=\"120\" rx=\"12\"/>\n      <circle cx=\"${x-54}\" cy=\"${y-30}\" r=\"5\" fill=\"${c}\"/><text x=\"${x-42}\" y=\"${y-25}\">VLAN ${v.id}<\/text>\n      <text x=\"${x-58}\" y=\"${y-3}\" style=\"font:800 14px var(--f)\">${v.n}<\/text>\n      <text class=\"s\" x=\"${x-58}\" y=\"${y+17}\">${v.net}<\/text><text class=\"s\" x=\"${x-58}\" y=\"${y+33}\">gw ${v.gw}<\/text>\n      <text class=\"s\" x=\"${x-58}\" y=\"${y+53}\" style=\"fill:var(--brass-l)\">${v.cl} client<\/text><\/g>`});\n  return `<div class=\"map\"><svg viewBox=\"0 0 ${W} 390\">${L}${N}<\/svg><\/div>\n   <div class=\"legend\"><span>${sem('g',1)}ok<\/span><span>${sem('a',1)}warning<\/span><span>${sem('r',1)}problem<\/span><span><i style=\"border-top-style:dashed\"><\/i>isolated VLAN / backup line<\/span><\/div>`}\nfunction netList(){\n  const Q=NV.q.toLowerCase();\n  const L=D.nd.filter(d=>(NV.t==='All'||d.t===NV.t)&&(!NV.pb||d.s!=='g')&&(!Q||(d.id+' '+d.ip+' '+d.loc+' '+d.t).toLowerCase().includes(Q)));\n  return `<div class=\"nfil\"><div class=\"srch\">${ic('srch',2)}<input id=\"nq\" value=\"${esc(NV.q)}\" placeholder=\"Name, IP or location\" oninput=\"NV.q=this.value;netRelist()\"><\/div><button class=\"mapb\" onclick=\"go('netmap')\" title=\"Network map\">${ic('map',1.8)}<span>Map<\/span><\/button><\/div>\n   <div class=\"nfil\"><div class=\"chips\">${['All','Firewall','Switch','Access point','Uplink'].map(t=>`<button class=\"chip${NV.t===t?' on':''}\" onclick=\"NV.t='${t}';render()\">${t}<\/button>`).join('')}\n   <button class=\"chip${NV.pb?' on':''}\" onclick=\"NV.pb=!NV.pb;render()\">Solo problemi<\/button><\/div><\/div>\n   <div class=\"gc\" id=\"nlist\">${L.map(d=>`<button class=\"nrow${NV.sel==='d:'+d.id?' sel':''}\" onclick=\"netSel('d:${d.id}')\">${sem(d.s,1)}<b>${d.id}<\/b><span class=\"ip\">${d.ip}<\/span><span class=\"sub\">${d.t} \u00b7 ${d.loc}${d.note?' \u00b7 '+d.note:''}<\/span><\/button>`).join('')||'<div class=\"empty\">No results<\/div>'}<\/div>\n   <div class=\"sechd\">${L.length} of ${D.nd.length} devices<\/div>`}\nfunction netRelist(){const y=$('mn').scrollTop;render();const q=$('nq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}$('mn').scrollTop=y}\nfunction netDetail(key){\n  const [k,id]=[key[0],key.slice(2)];\n  if(k==='v'){const v=D.vl.find(x=>x.id==id);const devs=D.nd.filter(d=>d.ip.startsWith(v.net.split('.').slice(0,3).join('.')+'.'));\n    return `<div class=\"dhd\">${sem(v.s)}<h2>VLAN ${v.id} \u00b7 ${v.n}<\/h2><span class=\"edslot\"><\/span><\/div>\n     <div class=\"ed-own\"><div class=\"kv\"><span>Network<\/span><b>${v.net}<\/b><span>Gateway<\/span><b>${v.gw}<\/b><span>DHCP<\/span><b>${v.dhcp}<\/b><span>Clients<\/span><b>${v.cl}<\/b><\/div>\n     <div class=\"dnote\">${v.note||'No notes'}<\/div><\/div>\n     ${devs.length?`<div class=\"sechd\">Devices in this VLAN<\/div>${devs.map(d=>`<button class=\"nrow\" onclick=\"netSel('d:${d.id}')\">${sem(d.s,1)}<b>${d.id}<\/b><span class=\"ip\">${d.ip}<\/span><\/button>`).join('')}`:''}\n     <div class=\"dbtns\"><button onclick=\"NV.q='${v.net.split('.').slice(0,3).join('.')}.';NV.sel=null;closeOv();if(cur()==='netmap')back();else render()\">Show in list<\/button><button class=\"pr\" onclick=\"newTicket()\">Open ticket<\/button><\/div>`}\n  const d=ndv(id),kids=D.nd.filter(x=>x.up===id);\n  return `<div class=\"dhd\">${sem(d.s)}<h2>${d.id}<\/h2><span class=\"edslot\"><\/span><\/div>\n   <div class=\"ed-own\"><div class=\"kv\"><span>Type<\/span><b>${d.t}<\/b><span>IP<\/span><b style=\"font-family:var(--m)\">${d.ip}<\/b><span>Location<\/span><b>${d.loc}<\/b>${d.up?`<span>Connected to<\/span><b>${d.up} \u00b7 port ${d.port}<\/b>`:''}${kids.length?`<span>Downstream<\/span><b>${kids.map(x=>x.id).join(', ')}<\/b>`:''}<\/div>\n   <div class=\"dnote\">${d.note||'No notes'}<\/div><\/div>\n   <div class=\"dbtns\">${cur()==='netmap'?`<button onclick=\"NV.q='${d.id}';closeOv();back()\">Show in list<\/button>`:`<button onclick=\"closeOv();NM.v='l2';go('netmap')\">Show on map<\/button>`}<button class=\"pr\" onclick=\"closeOv();newTicket('${d.id}')\">Open ticket<\/button><button onclick=\"closeOv();parent.postMessage({nfc:'NET:'+'${d.id}'},'*')\">NFC tag<\/button><\/div>`}\nconst NM={v:'l3'};\nfunction netSel(key){NV.sel=key;if(!key){closeOv();render();return}\n  if(LAND&&cur()!=='netmap'){closeOv();const y=$('mn').scrollTop;render();$('mn').scrollTop=y}else{const y=$('mn').scrollTop;render();$('mn').scrollTop=y;sheet(netDetail(key),true)}}\n\n/* ============ OVERLAY ============ */\nfunction ov(html){const o=$('ov');o.innerHTML=`<div class=\"dim\" onclick=\"closeOv()\"><\/div>`+html;o.className='ov show'}\nfunction closeOv(){$('ov').className='ov';$('ov').innerHTML=''}\nfunction toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);setTimeout(()=>t.remove(),1800)}\n\nfunction sheet(html,sky){ov(`<div class=\"sheet${sky?' sk':''}\"><div class=\"grab\"><\/div>${html}<\/div>`)}\n\n/* ===== SHIP: salvataggio dati sezione ===== */\ntry{const x=JSON.parse(localStorage.getItem('ship:net')||'null');if(x&&x.d&&x.v===3){if(x.d['D.nd'])(Array.isArray(D.nd)?D.nd.splice(0,D.nd.length,...x.d['D.nd']):Object.assign(D.nd,x.d['D.nd']));if(x.d['D.vl'])(Array.isArray(D.vl)?D.vl.splice(0,D.vl.length,...x.d['D.vl']):Object.assign(D.vl,x.d['D.vl']))}}catch(e){}\n/* ============ LAYOUT TABLET (2:3 verticale, 3:2 orizzontale) ============ */\nlet LAND=false,PV='auto';\ntry{PV=localStorage.getItem('pvnet')||(innerWidth>=1400&&matchMedia('(pointer:fine)').matches?'p':'auto')}catch(e){PV='auto'}\nfunction layout(){PV='auto';\n  const vw=innerWidth,vh=innerHeight,app=$('app'),fr=$('frame');let x=0,y=0,w=vw,h=vh;\n  /* dimensioni reali: niente ingrandimento. In anteprima: Surface Go 4 (1920x1280 al 150% = 853x1280 CSS px), rimpicciolito solo per starci nello schermo */\n  let W=vw,H=vh,s=1;\n  if(PV!=='auto'){W=PV==='p'?853:1280;H=PV==='p'?1280:853;const m=40;s=Math.min(1,(vw-2*m)/W,(vh-2*m)/H);w=W*s;h=H*s;x=(vw-w)/2;y=(vh-h)/2}\n  LAND=W>H;\n  app.style.cssText=`--W:${W};--H:${H};--s:${s};left:${x}px;top:${y}px`;\n  fr.style.cssText=PV==='auto'?'display:none':`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;\n  document.body.classList.toggle('framed',PV!=='auto');\n  $('pv').innerHTML=[['p','Portrait'],['l','Landscape'],['auto','Full screen']].map(o=>`<button class=\"${PV===o[0]?'on':''}\" onclick=\"setPV('${o[0]}')\">${o[1]}<\/button>`).join('');\n  render();\n}\nfunction setPV(m){PV=m;try{localStorage.setItem('pvnet',m)}catch(e){}layout()}\naddEventListener('resize',layout);\nlayout();\n\nfunction openHash(hh){const h=hh!=null?hh:decodeURIComponent(location.hash.slice(1));if(!h)return;if(ndv(h)){stack=['net'];NV.q=h;render();netSel('d:'+h)}}\naddEventListener('hashchange',openHash);openHash();\n/* ===== indizio di scorrimento ===== */\n(function(){const mn=document.getElementById('mn'),h=document.getElementById('morehint');\n  function upd(){const more=mn.scrollHeight-mn.clientHeight-mn.scrollTop>24,up=mn.scrollTop>8;\n    mn.classList.toggle('more',more);mn.classList.toggle('up',up);h.classList.toggle('show',more&&mn.scrollTop<40)}\n  mn.addEventListener('scroll',upd,{passive:true});\n  new MutationObserver(()=>requestAnimationFrame(upd)).observe(mn,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});\n  new ResizeObserver(upd).observe(mn);addEventListener('resize',upd);setTimeout(upd,50);\n})();\n\n/* ===== Edit: un solo pulsante nelle schede finali (utente, fornitore, software, device, VLAN) ===== */\n(function(){\n  const LS='edits2:Network';\n  let E={};try{E=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}\n  const store=()=>{try{localStorage.setItem(LS,JSON.stringify(E))}catch(e){}};\n  const PEN='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13 7l4 4\"/><\/svg>';\n  const route=()=>{try{return typeof cur==='function'?cur():''}catch(e){return ''}};\n  const say=m=>{try{toast(m)}catch(e){}};\n  const scopes=()=>{const L=[];const sh=document.querySelector('#ov .sheet');if(sh&&sh.querySelector('.ed-own'))L.push(sh);const mn=document.getElementById('mn');if(mn.querySelector('.ed-own'))L.push(mn);return L};\n  function wrapText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const L=[];let n;\n    while(n=w.nextNode()){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(p.closest('svg'))continue;if(p.children.length)L.push(n)}\n    L.forEach(t=>{const s=document.createElement('span');t.replaceWith(s);s.appendChild(t)})}\n  const leaves=el=>[...el.querySelectorAll('*')].filter(x=>!x.children.length&&x.textContent.trim()&&!x.closest('svg,.av,.sem,.dbar,.bar2,.rbar,h4')&&!['BUTTON','INPUT'].includes(x.tagName));\n  function keyOf(sc,el,i){return route()+'|'+(sc.id||'sheet')+'|'+i+'|'+el.textContent.replace(/\\s+/g,' ').trim().slice(0,40)}\n  function btnHTML(){return `<button class=\"edpage\" type=\"button\">${PEN}Edit<\/button>`}\n  function place(sc){const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child, #hd .edslot'):null);\n    if(!slot)return;slot.classList.add('edslot');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function start(sc,slot){sc._orig=[...sc.querySelectorAll('.ed-own')].map(x=>x.innerHTML);sc.classList.add('editmode');\n    sc.querySelectorAll('.ed-own').forEach(o=>{[o,...o.querySelectorAll('[onclick]')].forEach(x=>{if(x.getAttribute('onclick')){x.dataset.oc=x.getAttribute('onclick');x.removeAttribute('onclick')}});wrapText(o);leaves(o).forEach(x=>x.setAttribute('contenteditable','true'))});\n    slot.innerHTML='<span class=\"edgrp\"><button class=\"edpage\" type=\"button\">Cancel<\/button><button class=\"edpage sv\" type=\"button\">Save<\/button><\/span>';\n    const [cn,sv]=slot.querySelectorAll('button');\n    cn.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach((o,i)=>o.innerHTML=sc._orig[i]);end(sc,slot)};\n    sv.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach(o=>{o.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));\n      [o,...o.querySelectorAll('[data-oc]')].forEach(x=>{if(x.dataset.oc){x.setAttribute('onclick',x.dataset.oc);delete x.dataset.oc}});E[o.dataset.ek]=o.innerHTML});store();end(sc,slot);say('Change saved')};\n    const f=sc.querySelector('.ed-own [contenteditable]');if(f)f.focus()}\n  function end(sc,slot){sc.classList.remove('editmode');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function decorate(){scopes().forEach(sc=>{if(sc.classList.contains('editmode'))return;let fresh=false;\n    sc.querySelectorAll('.ed-own').forEach((o,i)=>{if(o.dataset.ek)return;fresh=true;o.dataset.ek=keyOf(sc,o,i);if(E[o.dataset.ek]!=null)o.innerHTML=E[o.dataset.ek]});\n    const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child'):null);\n    if(slot&&!slot.querySelector('.edpage'))place(sc)})}\n  const obs=new MutationObserver(()=>{obs.disconnect();try{decorate()}finally{watch()}});\n  const watch=()=>['mn','ov','hd'].forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el,{childList:true,subtree:true})});\n  watch();setTimeout(()=>{obs.disconnect();decorate();watch()},60);\n})();\n\n\naddEventListener('message',e=>{const d=e.data||{};if('hash' in d){try{closeOv()}catch(x){}if(d.hash)openHash(d.hash);else{stack=[stack[0]];render()}}});\n\n(function(){const o=document.getElementById('ov');if(!o)return;let last=null;new MutationObserver(()=>{const v=o.classList.contains('show');if(v!==last){last=v;parent.postMessage({ov:v},'*')}}).observe(o,{attributes:true,attributeFilter:['class']})})();\n\n(function(){const f=()=>document.documentElement.classList.toggle('phone',innerWidth<600);f();addEventListener('resize',f)})();\n\nconst _rS=render;render=function(){_rS();try{localStorage.setItem('ship:net',JSON.stringify({v:3,t:Date.now(),d:{'D.nd':D.nd,'D.vl':D.vl}}))}catch(e){}};\n<\/script>\n<\/body><\/html>\n"</script>
<script type="application/json" id="sec-sw">"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Software<\/title>\n<style>\n:root{\n  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;\n  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;\n  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;\n  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;\n  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;\n  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;\n  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;\n  --f:-apple-system,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,Arial,sans-serif;\n  --m:\"SF Mono\",\"Cascadia Mono\",Consolas,ui-monospace,monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}\n#stage{position:fixed;inset:0}\n.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}\n.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}\n.framed .pv{display:flex}\n.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}\n.framed .app{border-radius:calc(22px / var(--s))}\n.wrap{position:absolute;inset:0;display:flex;flex-direction:column}\n/* ===== temi ===== */\n.sky{background:\n  radial-gradient(1px 1px at 12% 18%,#fff 60%,trans ribute('contenteditable','true'))});\n    slot.innerHTML='<span class=\"edgrp\"><button class=\"edpage\" type=\"button\">Cancel<\/button><button class=\"edpage sv\" type=\"button\">Save<\/button><\/span>';\n    const [cn,sv]=slot.querySelectorAll('button');\n    cn.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach((o,i)=>o.innerHTML=sc._orig[i]);end(sc,slot)};\n    sv.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.ed-own').forEach(o=>{o.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));\n      [o,...o.querySelectorAll('[data-oc]')].forEach(x=>{if(x.dataset.oc){x.setAttribute('onclick',x.dataset.oc);delete x.dataset.oc}});E[o.dataset.ek]=o.innerHTML});store();end(sc,slot);say('Change saved')};\n    const f=sc.querySelector('.ed-own [contenteditable]');if(f)f.focus()}\n  function end(sc,slot){sc.classList.remove('editmode');slot.innerHTML=btnHTML();slot.querySelector('.edpage').onclick=e=>{e.stopPropagation();start(sc,slot)}}\n  function decorate(){scopes().forEach(sc=>{if(sc.classList.contains('editmode'))return;let fresh=false;\n    sc.querySelectorAll('.ed-own').forEach((o,i)=>{if(o.dataset.ek)return;fresh=true;o.dataset.ek=keyOf(sc,o,i);if(E[o.dataset.ek]!=null)o.innerHTML=E[o.dataset.ek]});\n    const slot=sc.querySelector('.edslot')||(sc.id==='mn'?document.querySelector('#hd>span:last-child'):null);\n    if(slot&&!slot.querySelector('.edpage'))place(sc)})}\n  const obs=new MutationObserver(()=>{obs.disconnect();try{decorate()}finally{watch()}});\n  const watch=()=>['mn','ov','hd'].forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el,{childList:true,subtree:true})});\n  watch();setTimeout(()=>{obs.disconnect();decorate();watch()},60);\n})();\n\n\naddEventListener('message',e=>{const d=e.data||{};if('hash' in d){try{closeOv()}catch(x){}if(d.hash)openHash(d.hash);else{stack=[stack[0]];render()}}});\n\n(function(){const o=document.getElementById('ov');if(!o)return;let last=null;new Mu ort((a,b)=>SEVS.indexOf(a[0].g)-SEVS.indexOf(b[0].g));\n  return hero(crit?'r':'a',crit+' critical vulnerabilities')+\n   `<div class=\"kpis\">${SEVS.map(g=>`<div class=\"kpi\"><span class=\"n\">${sev(g)}<\/span><span class=\"n\" style=\"font-size:30px\">${cnt(VULNS,'g',g)}<\/span><\/div>`).join('')}<\/div>`+\n   `<div class=\"sechd\">Open findings<\/div>`+chips()+\n   `<div class=\"gc\">${L.map(([x,i])=>`<div class=\"li clk\" onclick=\"go('v${i}')\">${sev(x.g)}<span class=\"t\"><b>${x.d}<\/b><span>${x.v}<\/span><\/span><span style=\"font-size:12px;opacity:.7\">${x.f}<\/span>${chv()}<\/div>`).join('')||'<div class=\"empty\">No findings<\/div>'}<\/div>`}\nfunction patchView(){const P=PATCH.map((x,i)=>[x,i]).filter(([x])=>FV.c==='All'||x.c===FV.c).sort((a,b)=>PST.indexOf(a[0].s)-PST.indexOf(b[0].s)||SEVS.indexOf(a[0].g)-SEVS.indexOf(b[0].g));\n  return hero(cnt(PATCH,'s','To install')?'a':'g',cnt(PATCH,'s','To install')+' patches to install')+\n   `<div class=\"kpis\">${PST.map(s=>`<div class=\"kpi\"><span class=\"n\">${sem(s==='Installed'?'g':s==='To install'?'r':'a')}${cnt(PATCH,'s',s)}<\/span><span class=\"l\">${s}<\/span><\/div>`).join('')}<\/div>`+\n   `<div class=\"sechd\">All patches<\/div>`+chips()+\n   `<div class=\"gc\">${P.map(([x,i])=>`<div class=\"li clk\" onclick=\"go('p${i}')\">${sem(x.s==='Installed'?'g':x.s==='To install'?'r':'a',1)}<span class=\"t\"><b>${x.d} \u00b7 ${x.p}<\/b><span>${x.s} \u00b7 ${x.w}<\/span><\/span>${sev(x.g)}${chv()}<\/div>`).join('')||'<div class=\"empty\">No patches<\/div>'}<\/div>`}\nconst card=(icon,title,inner,own)=>`<div class=\"gc\"><h4>${ic(icon)}${title}<\/h4><div style=\"margin-top:8px\">${inner}<\/div><\/div>`;\nconst toolL=t=>SWID[t]?lnk(t,L_SW(t)):t;\nfunction vDetail(i){const x=VULNS[i],pt=PATCH.map((p,j)=>[p,j]).filter(([p])=>p.d===x.d);\n  return `<div class=\"lead\">${x.c==='End-user'?'End-user device':x.c==='Network'?'Network equipment':'Server'} \u00b7 ${x.v}<\/div>`+\n   hero(x.g==='Critical'?'r':x.g==='High'?'a':'a',`${x.g} severity \u00b7 reported ${x.r}`)+\n   `<div class=\"dgrid\">`+\n   card('sec','Finding',`<div class=\"kv\"><span>Device<\/span><b>${DEVL(x.d)}<\/b><span>Issue<\/span><b>${x.v}<\/b><span>Severity<\/span><b>${sev(x.g)}<\/b><span>Reported<\/span><b>${x.r}<\/b><span>Source<\/span><b>${toolL(x.f)}<\/b><\/div>${DASH[x.f]!=null?viewOn(x.f):''}`)+\n   card('inv','Related patches',pt.length?pt.map(([p,j])=>`<div class=\"li clk\" onclick=\"go('p${j}')\">${sem(p.s==='Installed'?'g':p.s==='To install'?'r':'a',1)}<span class=\"t\"><b>${p.p}<\/b><span>${p.s} \u00b7 ${p.w}<\/span><\/span>${chv()}<\/div>`).join(''):'<div class=\"empty\" style=\"padding:6px 0\">No patch linked yet<\/div>')+\n   `<\/div><div class=\"dbtns\" style=\"max-width:420px\"><button class=\"pr\" onclick=\"parent.postMessage({ticket:'${x.d}'},'*')\">Open ticket<\/button><\/div>`}\nfunction pDetail(i){const x=PATCH[i],vs=VULNS.map((v,j)=>[v,j]).filter(([v])=>v.d===x.d);\n  return `<div class=\"lead\">${x.t} patch \u00b7 ${x.p}<\/div>`+\n   hero(x.s==='Installed'?'g':x.s==='To install'?'r':'a',`${x.s} \u00b7 window: ${x.w}`)+\n   `<div class=\"dgrid\">`+\n   card('inv','Patch',`<div class=\"kv\"><span>Target<\/span><b>${DEVL(x.d)}<\/b><span>Patch<\/span><b>${x.p}<\/b><span>Type<\/span><b>${x.t}<\/b><span>Severity<\/span><b>${sev(x.g)}<\/b><span>Status<\/span><b>${x.s}<\/b><span>Window<\/span><b>${x.w}<\/b><span>Managed by<\/span><b>${toolL(x.f)}<\/b><\/div>${DASH[x.f]!=null?viewOn(x.f):''}`)+\n   card('sec','Vulnerabilities fixed',vs.length?vs.map(([v,j])=>`<div class=\"li clk\" onclick=\"go('v${j}')\">${sev(v.g)}<span class=\"t\"><b>${v.v}<\/b><span>reported ${v.r}<\/span><\/span>${chv()}<\/div>`).join(''):'<div class=\"empty\" style=\"padding:6px 0\">No linked vulnerability<\/div>')+\n   `<\/div><div class=\"dbtns\" style=\"max-width:420px\"><button class=\"pr\" onclick=\"parent.postMessage({ticket:'${x.d}'},'*')\">Open ticket<\/button><\/div>`}\nfunction render(){\n  const k=cur();\n  $('app').className='app sky'+(LAND?' land':'');\n  $('hd').innerHTML=`<button class=\"hb\" onclick=\"${stack.length>1?'back()':\"parent.postMessage({home:1},'*')\"}\">${ic('back',2.2)}<\/button>${T(k==='vul'?'VULNERABILITY':k==='patch'?'PATCHES':/^v\\d/.test(k)?'VULNERABILITY \u00b7 '+VULNS[+k.slice(1)].d:/^p\\d/.test(k)?'PATCHES \u00b7 '+PATCH[+k.slice(1)].d:'SECURITY')}<span><\/span>`;\n  const mn=$('mn');mn.className='mn fade';mn.innerHTML=k==='vul'?vulView():k==='patch'?patchView():/^v\\d/.test(k)?vDetail(+k.slice(1)):/^p\\d/.test(k)?pDetail(+k.slice(1)):mainView();mn.scrollTop=0;\n  $('isl').innerHTML=[ic('wheel',1.7),'<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M6.6 2.8c.6-.3 1.3-.1 1.7.4l2 2.9c.4.6.3 1.4-.2 1.9L8.8 9.3c1.1 2.4 3.3 4.6 5.9 5.9l1.3-1.3c.5-.5 1.3-.6 1.9-.2l2.9 2c.5.4.7 1.1.4 1.7l-.9 2c-.4.9-1.4 1.4-2.4 1.3C9.6 20 4 14.4 3.3 6.1c-.1-1 .4-2 1.3-2.4z\"/><\/svg>',ic('glob',1.7),ic('srch',2),ic('user')].map((x,i)=>`<button class=\"ib${i===2?' on':''}\" onclick=\"toast('Island: active after merge')\">${x}<\/button>`).join('');\n}\n/* ============ OVERLAY ============ */\nfunction ov(html){const o=$('ov');o.innerHTML=`<div class=\"dim\" onclick=\"closeOv()\"><\/div>`+html;o.className='ov show'}\nfunction closeOv(){$('ov').className='ov';$('ov').innerHTML=''}\nfunction toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);setTimeout(()=>t.remove(),1800)}\n\nfunction sheet(html,sky){ov(`<div class=\"sheet${sky?' sk':''}\"><div class=\"grab\"><\/div>${html}<\/div>`)}\n\n/* ===== SHIP: salvataggio dati sezione ===== */\ntry{const x=JSON.parse(localStorage.getItem('ship:sec')||'null');if(x&&x.d&&x.v===3){if(x.d['VULNS'])(Array.isArray(VULNS)?VULNS.splice(0,VULNS.length,...x.d['VULNS']):Object.assign(VULNS,x.d['VULNS']));if(x.d['PATCH'])(Array.isArray(PATCH)?PATCH.splice(0,PATCH.length,...x.d['PATCH']):Object.assign(PATCH,x.d['PATCH']))}}catch(e){}\n/* ============ LAYOUT TABLET (2:3 verticale, 3:2 <script type="application/json" id="sec-dep">"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Departments<\/title>\n<style>\n:root{\n  --night-1:#101B2B;--night-2:#1B2B42;--night-3:#2A3E5A;\n  --wood-1:#2E5A5E;--wood-2:#224548;--wood-3:#152D30;\n  --stone-1:#CFCCC5;--stone-2:#B9B6AF;--stone-3:#9E9B94;\n  --sage:#8FA382;--sage-d:#5E7458;--sage-l:#DCE4D4;\n  --brass:#C9A86A;--brass-l:#E6D3A6;--brass-d:#8C6D3B;\n  --cream:#F2EBDD;--cream-2:#E7DCC6;--ink:#22262B;--ink-2:#555A60;\n  --red:#C0503C;--red-l:#F0D6CE;--amber:#C98E2E;--amber-l:#F1E2C2;\n  --f:-apple-system,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,Arial,sans-serif;\n  --m:\"SF Mono\",\"Cascadia Mono\",Consolas,ui-monospace,monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;background:#0E1013;font:15px/1.4 var(--f);overflow:hidden}\n#stage{position:fixed;inset:0}\n.frame{position:absolute;border-radius:22px;box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #3a3d42,0 30px 70px rgba(0,0,0,.6);pointer-events:none}\n.pv{display:none;position:fixed;right:14px;top:14px;z-index:99;gap:4px;padding:4px;border-radius:999px;background:#23262c;border:1px solid #3a3d42;font:700 12px var(--f)}\n.framed .pv{display:flex}\n.pv button{padding:6px 12px;border-radius:999px;color:#aab}.pv button.on{background:#fff;color:#111}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.app{position:absolute;left:0;top:0;width:calc(var(--W)*1px);height:calc(var(--H)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;color:#fff;transition:background .35s}\n.framed .app{border-radius:calc(22px / var(--s))}\n.wrap{position:absolute;inset:0;display:flex;flex-direction:column}\n/* ===== temi ===== */\n.sky{background:\n  radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 62%,#e8eefc 60%,transparent),\n  radial-gradient(1.5px 1.5px at 83% 31%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 86%,#e8eefc 60%,transparent),\n  radial-gradient(1px 1px at 71% 12%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 44% 44%,#f3f0e6 60%,transparent),\n  radial-gradient(1px 1px at 93% 58%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 80%,#e8eefc 60%,transparent),\n  radial-gradient(ellipse at 50% 125%,rgba(201,168,106,.22) 0%,transparent 55%),\n  linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 60%,var(--night-3) 100%)}\n.deck{color:var(--cream);background:\n  radial-gradient(ellipse at 50% -10%,rgba(230,211,166,.16),transparent 55%),\n  repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,rgba(255,255,255,.03) 2px 5px),\n  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px),\n  linear-gradient(175deg,var(--wood-1) 0%,var(--wood-2) 45%,var(--wood-3) 100%)}\n.stone{color:var(--ink);background:\n  radial-gradient(1px 1px at 20% 30%,rgba(0,0,0,.14) 50%,transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.35) 50%,transparent),\n  linear-gradient(180deg,var(--stone-1),var(--stone-2));background-size:7px 7px,11px 11px,auto}\n.paperbg{color:var(--ink);background:linear-gradient(180deg,var(--cream),var(--cream-2))}\n/* ===== header ===== */\n.hd{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:22px 20px 10px;flex:none}\n.ttl{justify-self:center;font:800 32px var(--f);letter-spacing:.16em;padding-bottom:4px;border-bottom:2px solid var(--brass);white-space:nowrap}\n.ttl.s{font-size:24px}\n.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.stone .hb,.paperbg .hb{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.15)}\n.hb svg{width:22px;height:22px}\n.cmpb{position:relative;justify-self:end;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;\n  background:radial-gradient(circle at 35% 30%,#B7C6A9,var(--sage) 55%,var(--sage-d));box-shadow:0 0 0 2px rgba(220,228,212,.55),0 6px 16px rgba(0,0,0,.4)}\n.cmpb svg{width:27px;height:27px}\n.badge{position:absolute;top:-4px;right:-4px;font:700 10px var(--m);font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:1px 5px}\n.hdr{justify-self:end}\n/* ===== main ===== */\n.mn{flex:1;overflow-y:auto;padding:8px 20px 130px;-webkit-overflow-scrolling:touch}\n.mn.fix{overflow:hidden;position:relative;padding:0}\n.fade{animation:fd .28s ease}\n@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n/* ===== isola: nessuno stile ===== */\n.island{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 9px;border-radius:999px;z-index:30;\n  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.3)}\n.stone .island,.paperbg .island{background:rgba(40,40,40,.28)}\n.ib{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}\n.ib svg{width:24px;height:24px}\n.ib.on{background:rgba(255,255,255,.34)}\n.ib em{position:absolute;top:0;right:-3px;font:700 10px var(--m);font-style:normal;background:#fff;color:var(--ink);border-radius:999px;padding:1px 5px}\n/* ===== atlante ===== */\n/* verticale: costellazione a righe, niente posizioni assolute -> niente sovrapposizioni */\n.const{position:absolute;inset:0 16px 104px;display:flex;flex-direction:column;justify-content:space-evenly;container-type:size;padding:6px 0}\n.const .hemi{top:50%}\n.crow{position:relative;display:flex;justify-content:center;gap:max(24px,14cqw)}\n.crow.two{justify-content:space-between;padding:0 4cqw}\n.const .equator{position:relative;top:auto;flex:none}\n.const .st{position:relative;transform:none;left:auto;top:auto}\n/* orizzontale: colonne di schede con anteprima */\n.segv{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);margin:0 0 14px}\n.segv button{font:700 13.5px var(--f);letter-spacing:.04em;padding:8px 16px;border-radius:999px;opacity:.75}\n.segv button.on{background:#fff;color:var(--night-1);opacity:1}\n.mapb{flex:none;display:inline-flex;align-items:center;gap:8px;padding:0 16px;height:46px;border-radius:14px;font:800 13px var(--f);letter-spacing:.06em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.mapb svg{width:22px;height:22px}\n.nfil .srch{height:46px}\n.nmaps{display:grid;gap:6px}.land .nmaps{grid-template-columns:1fr 1fr;gap:16px;align-items:start}.nmaps .sechd:first-child{margin-top:4px}\n.netw{display:grid;gap:14px}.land .netw{grid-template-columns:minmax(0,1fr) 330px;align-items:start}\n.npanel{display:none}.land .npanel{display:block;position:sticky;top:0}\n.map{border-radius:18px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);padding:6px}\n.map svg{display:block;width:100%;height:auto}\n.land .map svg{max-height:calc(var(--H)*1px - 330px)}\n.map .n rect{fill:rgba(27,43,66,.92);stroke:rgba(255,255,255,.35);stroke-width:1}\n.map .n{cursor:pointer}.map .n:hover rect{stroke:#fff}\n.map .n.sel rect{stroke:var(--brass);stroke-width:2.5}\n.map .n text{fill:#fff;font:700 13px var(--f)}.map .n text.s{font:500 11px var(--m);fill:rgba(255,255,255,.65)}\n.map .ln{stroke:rgba(255,255,255,.38);stroke-width:1.6;fill:none}.map .ln.bad{stroke:var(--red);stroke-dasharray:6 5}.map .ln.bk{stroke-dasharray:3 4}\n.map .pt{font:600 10px var(--m);fill:var(--brass-l)}\n.map .vl rect{fill:rgba(143,163,130,.14)}.map .vl.iso rect{stroke-dasharray:5 4}\n.map .cloud{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.3)}\n.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;opacity:.75;margin:8px 4px 0}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{display:inline-block;width:22px;border-top:2px solid rgba(255,255,255,.5)}.legend i.bad{border-top:2px dashed var(--red)}\n.nfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}\n.nfil .srch{flex:1 1 220px;margin:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}.nfil .srch input{color:#fff}.nfil .srch input::placeholder{color:rgba(255,255,255,.55)}\n.nfil .chips{margin:0}\n.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid rgba(255,255,255,.1)}\n.nrow:first-child{border-top:0}.nrow b{font-size:15px}.nrow .ip{font:600 13px var(--m);opacity:.8;text-align:right}\n.nrow .sub{grid-column:2/4;font-size:12.5px;opacity:.65}.nrow.sel b{color:var(--brass-l)}\n.dhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.dhd h2{margin:0;font:800 20px var(--f);letter-spacing:.04em}\n.dnote{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13.5px}\n.dbtns{display:flex;gap:8px;margin-top:14px}.dbtns button{flex:1;padding:10px;border-radius:12px;font:800 13px var(--f);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}\n.dbtns button.pr{background:#fff;color:var(--night-1)}\n.acards{position:absolute;inset:4px 20px 100px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1fr;gap:14px}\n.ac{grid-column:span 3;min-height:0;display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border-radius:18px;overflow:hidden;\n  background:linear-gradient(180deg,rgba(143,163,130,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s}\n.ac.dn{grid-column:span 4;background:linear-gradient(180deg,rgba(201,168,106,.16),rgba(255,255,255,.05));border-color:rgba(230,211,166,.35)}\n.ac:active{transform:scale(.98)}\n.ach{display:flex;align-items:center;gap:10px;font:800 15px var(--f);letter-spacing:.12em}\n.ach svg{width:20px;height:20px;opacity:.9}.ach .go{margin-left:auto;opacity:.5}.ach .go svg{width:18px;height:18px}\n.acn{font-size:14.5px;font-weight:700;line-height:1.3;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1)}\n.acl{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}\n.acr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}\n.acr:first-child{border-top:0}.acr>span:not(.sem){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acr i{flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--m);font-style:normal;opacity:.7}\n.hemi{position:absolute;left:50%;top:52%;width:min(92cqw,96cqh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.10);\n  background:linear-gradient(180deg,rgba(143,163,130,.10) 0%,rgba(143,163,130,.03) 49.8%,rgba(201,168,106,.05) 50.2%,rgba(201,168,106,.14) 100%)}\n.equator{position:absolute;left:0;right:0;top:54%;border-top:1px dashed rgba(255,255,255,.25)}\n.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:210px}\n.sem{width:15px;height:15px;border-radius:50%;flex:none}\n.sem.r{background:var(--red);box-shadow:0 0 0 3px rgba(192,80,60,.3),0 0 18px 6px rgba(192,80,60,.55)}\n.sem.a{background:var(--amber);box-shadow:0 0 0 3px rgba(201,142,46,.3),0 0 18px 6px rgba(201,142,46,.5)}\n.sem.g{background:var(--sage);box-shadow:0 0 0 3px rgba(143,163,130,.3),0 0 18px 6px rgba(143,163,130,.55)}\n.sem.sm{width:10px;height:10px;box-shadow:none}\n.lb{display:inline-flex;align-items:center;gap:8px;font:800 17px var(--f);letter-spacing:.12em;padding:9px 16px;border-radius:999px;color:#fff;\n  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}\n.st:active .lb{transform:scale(.95)}\n.st.dn .lb{background:rgba(230,211,166,.14);border-color:rgba(230,211,166,.45)}\n.lb svg{width:20px;height:20px}\n.tag{font-size:14.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);max-width:210px;line-height:1.25}\n/* ===== componenti cielo ===== */\n.hero{display:flex;align-items:center;gap:10px;margin:4px 2px 14px;font-size:14px;color:#D8E0EA}\n.hero b{color:#fff}\n.gc{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.gc h4{margin:0;font:800 13px var(--f);letter-spacing:.14em;display:flex;align-items:center;gap:8px;text-transform:uppercase}\n.gc h4 small{margin-left:auto;font:600 12px var(--m);letter-spacing:0;opacity:.7}\n.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);width:100%;text-align:left}\n.li:first-of-type{border-top:0}\n.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:700}.li .t span{font-size:12.5px;opacity:.7}\n.chev{opacity:.5}\n.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}\n.cols{columns:2 300px;column-gap:12px}.cols>*{break-inside:avoid}\n.plg{display:grid;gap:0 18px}.land .plg{grid-template-columns:1fr 1fr;align-items:start}.land .plg .sechd:first-child{margin-top:0}\n.tile{position:relative;text-align:left;padding:12px;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);min-height:92px;display:flex;flex-direction:column;gap:4px}\n.tile b{font:800 14px var(--f);letter-spacing:.06em}. offsetHeight-12)+'px'}\nfunction untip(){$('tip').style.display='none'}\nconst sum=a=>a.reduce((x,y)=>x+y,0);\nconst tb=id=>`<span class=\"tb\" onclick=\"TBL['${id}']=!TBL['${id}'];render()\">${TBL[id]?'Chart':'Table'}<\/span>`;\n\nfunction lineChart(){const P=PER[PK],n=P.wk.length,W=600,H=210,l=34,r=64,t=14,b=26;\n  const mx=Math.max(...P.open,...P.closed)*1.15,X=i=>l+(W-l-r)*(n===1?0:i/(n-1)),Y=v=>t+(H-t-b)*(1-v/mx);\n  if(TBL.line)return `<table class=\"dtab\"><tr><th>Period<\/th><th>Open<\/th><th>Closed<\/th><\/tr>${P.wk.map((w,i)=>`<tr><td>${w}<\/td><td>${P.open[i]}<\/td><td>${P.closed[i]}<\/td><\/tr>`).join('')}<\/table>`;\n  let g='';for(let k=0;k<=4;k++){const v=Math.round(mx*k/4);g+=`<line class=\"ax\" x1=\"${l}\" x2=\"${W-r}\" y1=\"${Y(v)}\" y2=\"${Y(v)}\"/><text class=\"axt\" x=\"${l-6}\" y=\"${Y(v)+4}\" text-anchor=\"end\">${v}<\/text>`}\n  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ');\n  const xl=P.wk.map((w,i)=>`<text class=\"axt\" x=\"${X(i)}\" y=\"${H-6}\" text-anchor=\"middle\">${w}<\/text>`).join('');\n  const dots=(a,c)=>a.map((v,i)=>`<circle cx=\"${X(i)}\" cy=\"${Y(v)}\" r=\"4.5\" fill=\"${c}\" stroke=\"#1B2B42\" stroke-width=\"2\"/>`).join('');\n  let yo=Y(P.open[n-1]),yc=Y(P.closed[n-1]);if(Math.abs(yo-yc)<16){const m=(yo+yc)/2,up=yo<=yc;yo=m+(up?-8:8);yc=m+(up?8:-8)}\n  const end=(a,c,lab)=>`<text x=\"${X(n-1)+10}\" y=\"${(lab==='Open'?yo:yc)+4}\" style=\"fill:#fff;font:700 12px var(--f)\">${lab} ${a[n-1]}<\/text>`;\n  const hit=P.wk.map((w,i)=>`<rect class=\"hot\" x=\"${X(i)-(W-l-r)/(2*Math.max(1,n-1))}\" y=\"${t}\" width=\"${(W-l-r)/Math.max(1,n-1)}\" height=\"${H-t-b}\" fill=\"transparent\" onpointermove=\"lineHover(event,${i})\" onpointerleave=\"lineOut()\"/>`).join('');\n  return `<div class=\"lg\"><span><i style=\"background:${S1}\"><\/i>Open<\/span><span><i style=\"background:${S2}\"><\/i>Closed<\/span><\/div>\n   <svg viewBox=\"0 0 ${W} ${H}\" id=\"lsvg\">${g}${xl}<line id=\"xh\" class=\"ax\" x1=\"0\" x2=\"0\" y1=\"${t}\" y2=\"${H-b}\" style=\"stroke:rgba(255,255,255,.45);display:none\"/>\n   <path d=\"${path(P.open)}\" fill=\"none\" stroke=\"${S1}\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"${path(P.closed)}\" fill=\"none\" stroke=\"${S2}\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\n   ${dots(P.open,S1)}${dots(P.closed,S2)}${end(P.open,S1,'Open')}${end(P.closed,S2,'Closed')}${hit}<\/svg>`}\nfunction lineHover(e,i){const P=PER[PK],n=P.wk.length,W=600,l=34,r=64,x=l+(W-l-r)*(n===1?0:i/(n-1));const xh=$('xh');xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.style.display='';\n  tip(e,`<b>${P.wk[i]}<\/b><br><span style=\"color:${S1}\">\u25cf<\/span> Open ${P.open[i]}<br><span style=\"color:${S2}\">\u25cf<\/span> Closed ${P.closed[i]}`)}\nfunction lineOut(){untip();const xh=$('xh');if(xh)xh.style.display='none'}\nfunction hbars(id,rows,unit,col){if(TBL[id])return `<table class=\"dtab\">${rows.map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}${unit||''}<\/td><\/tr>`).join('')}<\/table>`;\n  const mx=unit==='%'?100:Math.max(...rows.map(r=>r[1]));\n  return rows.map(r=>`<div class=\"hb2 hot\" onpointermove=\"tip(event,'<b>${esc(r[0])}<\/b><br>${r[1]}${unit||''}')\" onpointerleave=\"untip()\"><span>${r[0]}<\/span><span class=\"tr\"><i style=\"width:${Math.max(2,100*r[1]/mx)}%;background:${col||S1}\"><\/i><\/span><b>${r[1]}${unit||''}<\/b><\/div>`).join('')}\nfunction devStack(){const tot=sum(DEVS.map(d=>d[1]));\n  if(TBL.dev)return `<table class=\"dtab\">${DEVS.map(d=>`<tr><td>${d[0]}<\/td><td>${d[1]}<\/td><\/tr>`).join('')}<\/table>`;\n  return `<div class=\"stk\">${DEVS.map(d=>`<i class=\"hot\" style=\"width:${100*d[1]/tot}%;background:${STC[d[2]]}\" onpointermove=\"tip(event,'<b>${d[0]}<\/b><br>${d[1]} device \u00b7 ${Math.round(100*d[1]/tot)}%')\" onpointerleave=\"untip()\"><\/i>`).join('')}<\/div>\n   <div class=\"stkl\">${DEVS.map(d=>`<span><i style=\"width:10px;height:10px;border-radius:3px;background:${STC[d[2]]}\"><\/i>${d[0]}<b>${d[1]}<\/b><\/span>`).join('')}<\/div>`}\n\nfunction mainView(){const P=PER[PK],op=P.open[P.open.length-1],cl=sum(P.closed),tot=sum(DEVS.map(d=>d[1]));\n  const ch=(cls,icon,title,sub,id,inner)=>`<div class=\"gc ch ${cls}\"><h4>${ic(icon)}${title}<small>${sub||''}<\/small>${id?tb(id):''}<\/h4><div style=\"margin-top:8px\">${inner}<\/div><\/div>`;\n  const tiles=[[op,'','Open tickets','today'],[cl,'','Closed tickets',P.name],[P.res,'d','Average resolution time',P.prev+': '+(P.res+0.4).toFixed(1)+' d'],[SEC.comp,'%','Compliant devices','target 95%'],[SEC.crit,'','Critical vulnerabilities',SEC.alte+' high'],[CTR.filter(c=>c[2]<90).length,'','Contracts expiring','within 90 days']];\n  return hero('a','September report due by 1 October')+\n  `<div class=\"rtop\"><div class=\"segv\">${Object.entries(PER).map(([k,v])=>`<button class=\"${PK===k?'on':''}\" onclick=\"PK='${k}';render()\">${v.lab}<\/button>`).join('')}<\/div>\n   <button class=\"genb\" onclick=\"genSheet()\">${ic('gen',1.8)}Generate management report<\/button><\/div>\n  <div class=\"tiles\">${tiles.map(t=>`<div class=\"tile2\"><div class=\"v\">${t[0]}<small>${t[1]}<\/small><\/div><div class=\"l\">${t[2]}<\/div><div class=\"d\">${t[3]}<\/div><\/div>`).join('')}<\/div>\n  <div class=\"rgrid\">`+\n   ch('full w2','tk','Open and closed tickets',P.name,'line',lineChart())+\n   ch('','dep','Tickets by department','','rep',hbars('rep',REPT[PK]))+\n   ch('','tk','Tickets by category','','cat',hbars('cat',CATT[PK]))+\n   ch('','inv','Device status',tot+' total','dev',devStack())+\n   ch('','pj','Project progress','','proj',hbars('proj',PROJ,'%',S2))+\n   ch('','doc','Contracts expiring','next 90 days','',CTR.filter(c=>c[2]<120).map(c=>`<div class=\"li\">${sem(c[2]<30?'r':c[2]<90?'a':'g',1)}<span class=\"t\"><b>${c[0]}<\/b><span>${c[1]}<\/span><\/span><span style=\"font:700 13px var(--m)\">${c[2]} d<\/span><\/div>`).join(''))+\n   ch('','sec','Security','data from the tools','',`<div class=\"li\">${sem('r',1)}<span class=\"t\"><b>${SEC.crit} critical function atlasConst(){const S=id=>star(secOf(id));

   <div class="equator"></div>

function preview(id){const ok={g:'g',a:'a',r:'r'};
  switch(id){
   case 'net':return D.net.flatMap(g=>g.items.filter(i=>i[2]!=='g').map(i=>[i[2],i[0]+' · '+i[1],i[3]])).concat(D.net.map(g=>['',g.g,g.items.length+'']));
   case 'sw':return D.sw.slice().sort((a,b)=>(a[2]==='g')-(b[2]==='g')).map(x=>[x[2],x[0]+' · '+x[1],'']);
   case 'sec':return D.sec.map(a=>[a[0],a[1],'']).concat(D.secOk.map(c=>[c[1]?'g':'a',c[0],c[1]?'ok':'to do']));
   case 'inv':{const t={};D.inv.forEach(i=>t[i[1]]=(t[i[1]]||0)+1);return D.inv.filter(i=>!/Assigned|Activ/.test(i[3])).map(i=>[/Faulty/.test(i[3])?'r':'a',i[0]+' · '+i[3],'']).concat(Object.entries(t).map(e=>['',e[0],e[1]+'']))}
   case 'sup':return D.sup.slice().sort((a,b)=>a[2]-b[2]).map(x=>[x[2]<30?'r':x[2]<90?'a':'g',x[0]+' · '+x[1],x[2]+' d']);
   case 'rep':return D.rep.map(r=>[r[2]?'g':'a',r[0]+' · '+r[1],'']);
   case 'dep':return D.dep.map(d=>[d[2]?(d[5]?'a':'g'):'r',d[1]+(d[2]?'':' · no lead'),d[5]+' tk']);
  }}
function atlasCards(){return `<div class="acards">${D.sections.map(s=>`<button class="ac ${s.h}" onclick="go('sec/${s.id}')">

   <div class="acn">${s.tag}</div>
   <div class="acl">${preview(s.id).map(r=>`<div class="acr">${r[0]?sem(r[0],1):'<span class="sem sm" style="background:rgba(255,255,255,.25)"></span>'}<span>${r[1]}</span>${r[2]?`<i>${r[2]}</i>`:''}</div>`).join('')}</div></button>`).join('')}</div>`}

/* ---- NETWORK: mappa L3, mappa L2, elenco ---- */
const NV={v:'ls',sel:null,q:'',t:'All',pb:false};
const ndv=id=>D.nd.find(d=>d.id===id);
function netBody(){
  return `<div class="netw"><div>${netList()}</div><div class="npanel"><div class="gc">${NV.sel?netDetail(NV.sel):'<div class="empty" style="padding:30px 10px">Tap a device or a VLAN to see details</div>'}</div></div></div>`}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function node(key,x,y,w,title,sub,st,sel){
  const c={g:'var(--sage)',a:'var(--amber)',r:'var(--red)'}[st]||'rgba(255,255,255,.4)';
  return `<g class="n${sel?' sel':''}" onclick="netSel('${key}')"><rect x="${x-w/2}" y="${y-22}" width="${w}" height="44" rx="10"/>
   <circle cx="${x-w/2+14}" cy="${y-6}" r="5" fill="${c}"/><text x="${x-w/2+26}" y="${y-2}">${esc(title)}</text><text class="s" x="${x-w/2+12}" y="${y+14}">${esc(sub)}</text></g>`}
function mapL2(){
  const pos={},W=800;
  pos['Fiber A']=[300,40];pos['Fiber B']=[500,40];pos['FW-01']=[400,130];pos['SW-CORE']=[400,230];
  const acc=D.nd.filter(d=>d.t==='Switch'&&d.id!=='SW-CORE');acc.forEach((d,i)=>pos[d.id]=[100+i*200,350]);
  D.nd.filter(d=>d.t==='Access point').forEach(d=>{const p=pos[d.up];pos[d.id]=[p[0],470]});
  let L='';
  const link=(a,b,port,bad,bk)=>{const [x1,y1]=pos[a],[x2,y2]=pos[b],my=(y1+y2)/2;
    L+=`<path class="ln${bad?' bad':''}${bk?' bk':''}" d="M${x1} ${y1+22} C${x1} ${my},${x2} ${my},${x2} ${y2-22}"/>`;
    if(port)L+=`<text class="pt" x="${(x1+x2)/2+6}" y="${my+4}">${esc(port)}</text>`};
  link('Fiber A','FW-01','WAN1');link('Fiber B','FW-01','WAN2',false,true);
  D.nd.filter(d=>d.up&&d.t!=='Firewall').forEach(d=>link(d.up,d.id,d.port,d.s==='r'||ndv(d.up).s==='r'));
  const N=D.nd.map(d=>node('d:'+d.id,pos[d.id][0],pos[d.id][1],d.t==='Uplink'?130:150,d.id,d.t==='Uplink'?d.loc:d.ip,d.s,NV.sel==='d:'+d.id)).join('');
  return `<div class="map"><svg viewBox="0 0 ${W} 510">${L}${N}</svg></div>
   <div class="legend"><span>${sem('g',1)}ok</span><span>${sem('a',1)}warning</span><span>${sem('r',1)}offline</span><span><i></i>cable</span><span><i class="bad"></i>broken link</span><span style="font-family:var(--m);color:var(--brass-l)">1 ↔ 24</span><span>upstream port ↔ local port</span></div>`}
function mapL3(){
  const W=800;let L='',N='';
  N+=`<ellipse class="cloud" cx="400" cy="42" rx="120" ry="28"/><text x="400" y="47" text-anchor="middle" style="fill:#fff;font:800 13px var(--f);letter-spacing:.12em">INTERNET</text>`;
  L+=`<path class="ln" d="M340 66 L370 118"/><path class="ln bk" d="M460 66 L430 118"/><text class="pt" x="300" y="98">WAN1 · Fiber A</text><text class="pt" x="440" y="98">WAN2 · Fiber B</text>`;
  N+=node('d:FW-01',400,140,190,'FW-01 · gateway','inter-VLAN routing','g',NV.sel==='d:FW-01');
  L+=`<path class="ln" d="M400 162 L400 205"/><path class="ln" d="M80 205 L720 205"/>`;
  const n=D.vl.length,step=640/(n-1);
  D.vl.forEach((v,i)=>{const x=80+i*step,y=300;
    L+=`<path class="ln${v.iso?' bk':''}" d="M${x} 205 L${x} ${y-50}"/><text class="pt" x="${x+6}" y="232">${v.gw.split('.').slice(-1)[0]==='1'?'.1':''}</text>`;
    const c={g:'var(--sage)',a:'var(--amber)',r:'var(--red)'}[v.s],sel=NV.sel==='v:'+v.id;
    N+=`<g class="n vl${v.iso?' iso':''}${sel?' sel':''}" onclick="netSel('v:${v.id}')"><rect x="${x-70}" y="${y-50}" width="140" height="120" rx="12"/>
      <circle cx="${x-54}" cy="${y-30}" r="5" fill="${c}"/><text x="${x-42}" y="${y-25}">VLAN ${v.id}</text>
      <text x="${x-58}" y="${y-3}" style="font:800 14px var(--f)">${v.n}</text>
      <text class="s" x="${x-58}" y="${y+17}">${v.net}</text><text class="s" x="${x-58}" y="${y+33}">gw ${v.gw}</text>
      <text class="s" x="${x-58}" y="${y+53}" style="fill:var(--brass-l)">${v.cl} client</text></g>`});
  return `<div class="map"><svg viewBox="0 0 ${W} 390">${L}${N}</svg></div>
   <div class="legend"><span>${sem('g',1)}ok</span><span>${sem('a',1)}warning</span><span>${sem('r',1)}problem</span><span><i style="border-top-style:dashed"></i>isolated VLAN / backup line</span></div>`}
function netList(){
  const Q=NV.q.toLowerCase();
  const L=D.nd.filter(d=>(NV.t==='All'||d.t===NV.t)&&(!NV.pb||d.s!=='g')&&(!Q||(d.id+' '+d.ip+' '+d.loc+' '+d.t).toLowerCase().includes(Q)));
  return `<div class="nfil"><div class="srch">${ic('srch',2)}<input id="nq" value="${esc(NV.q)}" placeholder="Name, IP or location" oninput="NV.q=this.value;netRelist()"></div><button class="mapb" onclick="go('netmap')" title="Network map">${ic('map',1.8)}<span>Map</span></button></div>

/* ============ BUSSOLA: rotta calcolata in tempo reale dalla Plancia ============ */
const FEED={};let ROTTA=[];
const TODAY=new Date(2026,8,26);
const dl=d=>d?Math.round((new Date(d)-TODAY)/864e5):999;
const fd=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
function computeRotta(){const R=[];
  const tk=FEED.tk||[],ot=FEED.ot||[],ck=FEED.ck||[],pj=FEED.pj||[];
  const closed=new Set(tk.filter(t=>t.st==='Closed').map(t=>t.id));
  tk.filter(t=>t.st!=='Closed').forEach(t=>R.push({s:(t.u?90:45)+(t.st==='Open'?5:0),src:'Ticket',t:`#${t.id} ${t.t}`,m:`${t.st} · ${t.dep}${t.to!=='IT Manager'?' · handled by '+t.to:''}`,go:['tk','t'+t.id]}));
  ot.filter(t=>!t.st&&!(t.tk.length&&t.tk.every(x=>closed.has(x)))).forEach(t=>{const n=dl(t.due);R.push({s:({high:78,medium:48,low:22})[t.p]+(n<=1?15:n<=3?8:0),src:'Task',t:t.t,m:`priority ${t.p} · by ${fd(t.due)}${n<=3?' (in '+Math.max(n,0)+' d)':''}${t.tk.length?' · ticket #'+t.tk.join(', #'):''}`,go:['ot','k'+t.id]})});
  ck.filter(c=>c.next&&c.done<c.tot&&dl(c.next)<=10).forEach(c=>{const n=dl(c.next);R.push({s:n<=0?88:n<=2?72:n<=5?55:38,src:'Checklist',t:c.n,m:`${c.done}/${c.tot} items · by ${fd(c.next)}${n<=5?' (in '+Math.max(n,0)+' d)':''}`,go:['ck','c-'+c.id]})});
  pj.filter(p=>/CAPEX/.test(p.bud)&&p.st!=='Closed').forEach(p=>R.push({s:25,src:'Project',t:p.n,m:`${p.pct}% · budget to approve`,go:['pj','p-'+p.id]}));
  R.sort((a,b)=>b.s-a.s);ROTTA=R;
  const b=document.querySelector('.ib .rbd');if(b)b.textContent=R.length;const tb=document.querySelector('.ib .tkb');if(tb)tb.textContent=tk.filter(t=>t.st!=='Closed').length;
  if($('sr')&&!($('sq')&&$('sq').value.trim()))drawRotta()}
const lvl=s=>s>=70?'r':s>=40?'a':'g';
function drawRotta(){const R=ROTTA,sr=$('sr');if(!sr)return;
  if(!R.length){sr.innerHTML=`<div class="bus"><div class="bush">${ic('cmp',1.6)}<b>Today’s course</b><small>${TODAY.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</small></div><div class="busnow"><span>CLEAR COURSE</span><b>Nothing to do: everything under control</b></div></div>`;return}
  const [n0,...rest]=R;
  sr.innerHTML=`<div class="bus"><div class="bush">${ic('cmp',1.6)}<b>Today’s course</b><small>${TODAY.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · ${R.length} items</small></div>
   <div class="busgrid"><div class="busnow" onclick="goTo('${n0.go[0]}','${n0.go[1]}')"><span>FIRST OF ALL</span><b>${n0.t}</b><em>${n0.src} · ${n0.m}</em></div>
   <div class="busl" id="busl"><div class="busst">Then, by importance</div>${rest.map((r,j)=>`<div class="busr" onclick="goTo('${r.go[0]}','${r.go[1]}')"><span class="n ${lvl(r.s)}">${j+2}</span><span class="t"><b>${r.t}</b><small>${r.m}</small></span><span class="src">${r.src}</span></div>`).join('')}</div></div>
   <div class="busfoot">Updates itself when you close tickets, tasks, checklists or projects</div></div>`;
  requestAnimationFrame(fitRotta)}
function fitRotta(){const b=$('busl');if(!b)return;const rows=[...b.querySelectorAll('.busr')];let hid=0;
  while(b.scrollHeight>b.clientHeight+1&&rows.length){rows.pop().remove();hid++}

function layout(){
  const vw=innerWidth,vh=innerHeight,app=$('app'),fr=$('frame');let x=0,y=0,w=vw,h=vh;
  /* dimensioni reali: niente ingrandimento. In anteprima: Surface Go 4 (1920x1280 al 150% = 853x1280 CSS px), rimpicciolito solo per starci nello schermo */

let ACX=null;
function beep(ok=true){if(!NFC.set.beep)return;try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();const o=ACX.createOscillator(),g=ACX.createGain();o.frequency.value=ok?1320:330;g.gain.value=.08;o.connect(g);g.connect(ACX.destination);o.start();o.stop(ACX.currentTime+(ok?.09:.25))}catch(e){}}
